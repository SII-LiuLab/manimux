<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">ManiMux — A Unified Platform for Real-Robot Experiments</title>
  <desc id="desc">Any Policy × Embodiment × Inference. Compose, execute, observe and evaluate with one shared runtime.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1225"/>
      <stop offset="1" stop-color="#142b43"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22d3ee" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#background)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <ellipse cx="1050" cy="150" rx="430" ry="300" fill="url(#glow)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="64" y="44" width="5" height="16" rx="2.5" fill="#67e8f9"/>
    <text x="82" y="57" font-size="12" font-weight="600" letter-spacing="3" fill="#b0c4d9">REAL ROBOTS. SHARED INFRASTRUCTURE.</text>
    <text x="60" y="151" font-size="86" font-weight="800" letter-spacing="-4" fill="#f8fafc">Mani<tspan fill="url(#accent)">Mux</tspan></text>
    <text x="64" y="194" font-size="26" font-weight="500" fill="#dce7f5">A Unified Platform for Real-Robot Experiments</text>
    <g font-size="20" font-weight="600" text-anchor="middle">
      <rect x="64" y="229" width="170" height="47" rx="12" fill="#152e41" stroke="#315268"/>
      <text x="149" y="259" fill="#82e7f5">Any Policy</text>
      <text x="259" y="260" fill="#7c94ae" font-size="26">×</text>
      <rect x="284" y="229" width="200" height="47" rx="12" fill="#202e48" stroke="#414e70"/>
      <text x="384" y="259" fill="#b8c5ff">Embodiment</text>
      <text x="509" y="260" fill="#7c94ae" font-size="26">×</text>
      <rect x="534" y="229" width="170" height="47" rx="12" fill="#25343e" stroke="#4b575e"/>
      <text x="619" y="259" fill="#fbd3a0">Inference</text>
    </g>
    <path d="M64 312H1216" stroke="#294057"/>
    <text x="64" y="352" font-size="15" letter-spacing="1" fill="#b0c4d9">COMPOSE<tspan dx="24" fill="#526b85">/</tspan><tspan dx="24">EXECUTE</tspan><tspan dx="24" fill="#526b85">/</tspan><tspan dx="24">OBSERVE</tspan><tspan dx="24" fill="#526b85">/</tspan><tspan dx="24">EVALUATE</tspan></text>
    <text x="1216" y="352" text-anchor="end" font-size="14" fill="#91acc6">One runtime. Every experiment.</text>
  </g>
  <g fill="none" stroke-width="2">
    <rect x="954" y="62" width="212" height="212" rx="48" stroke="#35516c" transform="rotate(12 1060 168)"/>
    <rect x="982" y="90" width="156" height="156" rx="36" stroke="#52758c" transform="rotate(-12 1060 168)"/>
    <path d="M1004 185V150L1032 178L1060 137L1088 178L1116 150V185" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1024 212H1096" stroke="#fbd3a0" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
