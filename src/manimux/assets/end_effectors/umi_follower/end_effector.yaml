# UMI follower gripper (XenseRobotics TacCap), from the 从夹爪组件0720 CAD.
name: umi_follower
urdf: end_effector.urdf
root_link: base_link

# Flange -> base_link. The mount spigot puts the flange face at base_link
# x = -50.5 mm and its four radial screws fix the roll; derived from the CAD in
# SII-LiuLab/tianji-control d1def56.
mount:
  xyz: [-0.01575, 0.0, 0.0505]
  rpy: [3.141592653589793, -1.5707963267948966, 0.0]

# base_link -> midpoint of the two tactile pads with the jaws closed. The pads
# pivot, so the midpoint slides about +-3 mm along the approach axis.
tcp:
  xyz: [0.11895, 0.0, -0.020995]
  rpy: [0.0, 0.0, 0.0]

inputs: 1
rest_inputs: [1.0]
aperture_input: 0

# Normalized aperture (0 closed, 1 open) -> CAD finger angle. 0 rad is the CAD's
# open pose (127 mm between the pads); -0.44 rad brings the pads together. The
# firmware aperture is a fraction of motor travel, so this map is visual only.
joints:
  - {joint: joint1, input: 0, at_0: -0.44, at_1: 0.0}
