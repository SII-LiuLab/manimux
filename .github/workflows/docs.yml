name: Website and Guide

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'guideline.html'
      - 'assets/manimux-robogui-demo.webp'
      - 'assets/dream1-task-1440p30.mp4'
      - 'assets/manimux_2026-09-05_23-17-35-00.00.03.144-00.00.34.914-seg1-00.00.02.596-00.00.34.966.mp4'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build website and guide
        run: |
          node --check website/app.js
          python3 website/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website and guide
        id: deployment
        uses: actions/deploy-pages@v4
