# Hardware-free SAPolicy loop: mock dual-arm + mock camera + XPolicyLab WS.
#
#   python scripts/servers/sapolicy_yam_server.py --config configs/sapolicy/yam/server/abc-bottles.yaml
#   python scripts/validation/sapolicy_yam_mock_run.py
#
# Or, with envs/yam (mink/i2rt present):
#   envs/yam/.venv/bin/python scripts/validation/sapolicy_yam_mock_run.py --no-server

run:
  task: put the plastic bottles in the bin
  output_dir: ./data
  max_steps: 48

robot:
  driver: mock_dual_arm
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7

sensors:
  - name: front_camera
    driver: mock_camera
    width: 64
    height: 48
    fps: 30.0

policy:
  worker: xpolicylab_ws
  adapter: sapolicy_yam
  action_dt_s: 0.03333333333333333
  timeout_s: 8.0
  horizon_steps: 16
  inference_delay_s: 0.0
  startup_timeout_s: 30.0
  options:
    server: ws://127.0.0.1:8500
    connect_timeout_s: 5.0
    request_timeout_s: 8.0
    group_order: [left_arm, right_arm]
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      agentview: front_camera
    camera_intrinsics:
      agentview:
        - [394.7972412109375, 0.0, 317.49383544921875]
        - [0.0, 394.2569885253906, 241.21372985839844]
        - [0.0, 0.0, 1.0]
    kinematics: yam
    kinematics_options:
      arm_type: yam
      gripper_type: linear_4310
      num_arm_joints: 6
      pos_threshold: 0.004
      ori_threshold: 0.002
      max_iters: 300

execution:
  runtime: manimux
  executor: direct
  inference_schedule: single_inflight
  refill_threshold_s: 0.25
  commit_lead_s: 0.0
  max_plan_age_s: 2.0
  blend_steps: 0

viewer:
  enabled: false
  robot_adapter: mock_dual_arm
  policy_label: SAPolicy mock · XPolicyLab WS

recording:
  enabled: true
  video_fps: 0.0
