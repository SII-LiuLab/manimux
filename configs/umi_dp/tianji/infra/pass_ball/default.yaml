# Bind with scripts/servers/umi_dp_tianji_server.py before using tianji_dual.
control_profile: ../../../../robots/tianji/common.yaml
run:
  task: pass the ball between the two grippers
  output_dir: ./data/experiments/umi-dp-tianji
  max_steps: 6000
robot:
  control_hz: 250.0
sensors:
  - name: tianji_wrist_history
    driver: manimux.integrations.umi_dp_tianji.camera_sensor:build_sensor
    options:
      endpoint: tcp://127.0.0.1:5556
      camera_names: [left_wrist, right_wrist]
      max_frame_age_sec: 0.15
      clock_jump_tolerance_s: 0.02
policy:
  worker: xpolicylab_ws
  adapter: manimux.integrations.umi_dp_tianji.policy_plugin:build_adapter
  horizon_steps: 16 # launcher replaces with the checkpoint's H16/H64/etc.
  timeout_s: 30.0
  startup_timeout_s: 120.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_family: umi_dp
      observation_profile: tianji_umi_relative2
      action_semantics: absolute_per_arm_base_xyz_wxyz
  options:
    server: ws://127.0.0.1:8560
    connect_timeout_s: 30.0
    request_timeout_s: 30.0
    deployment_bound: false
    group_order: [left_arm, right_arm]
    group_prefixes: {left_arm: left, right_arm: right}
    gripper_dofs: 1
    camera_map:
      cam_left_wrist: left_wrist
      cam_right_wrist: right_wrist
      cam_left_wrist_prev: left_wrist_prev
      cam_right_wrist_prev: right_wrist_prev
    history_strategy: manimux
    observation_period_s: 0.1
    observation_tolerance_s: 0.04
    first_action_offset_s: 0.03333333333333333
    state_tolerance_s: 0.02
    camera_skew_s: 0.04
    kinematics: tianji
    kinematics_options:
      end_effector: umi_follower
    right_kinematics_options:
      joint_limits_deg: {6: [-58.0, 58.0]}
    ik_validation_dt_s: 0.004
    ik_backend: analytic  # bind with --ik-backend diff for the optional velocity QP
execution:
  runtime: manimux.integrations.umi_dp_tianji.history:build_strategy
  executor: smooth
  inference_schedule: single_inflight
  refill_threshold_s: 0.25
  max_plan_age_s: 2.0
  blend_steps: 2
  smooth:
    cutoff_hz: 8.0
    gripper:
      mode: close_latch
      close_threshold: 0.6
      open_threshold: 0.75
      closed_value: 0.2
viewer:
  enabled: false
  robot_adapter: tianji
  policy_label: UMI DP Tianji
recording:
  enabled: true
