# Joint+EEF training profile for the recorded YAM LeRobot dataset.
#
# The model is supervised on both representations of the same future motion:
#   arm.position: joint delta from the request-time joint state;
#   end.position: EE delta in the request-time EE frame, xyz+quaternion(xyzw).
# Grippers remain absolute.  The deployment bundle intentionally uses the
# joint-only robot config because ManiMux executes joint targets.
states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 6
        - observation.state:
            start: 7
            end: 13
  - observation.state.end.position:
      origin_keys: observation.state.end.position
      model_input: false
  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 6
            end: 7
        - observation.state:
            start: 13
            end: 14

actions:
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 6
        - action:
            start: 7
            end: 13
      subtract_state: true
      relative_type: vector
  - action.end.position:
      origin_keys: action.end.position
      subtract_state: true
      relative_type: quaternion_local
  - action.effector.position:
      origin_keys:
        - action:
            start: 6
            end: 7
        - action:
            start: 13
            end: 14
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.top_rgb
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.left_rgb
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.right_rgb

norm_stats: null
