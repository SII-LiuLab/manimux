run:
  task: Pick the target object and place it in the container.
  output_dir: ./data
  max_steps: 1600

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    move_to_start_on_connect: true
    start_duration_s: 3.5
    home_duration_s: 3.5
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xpolicylab_ws
  adapter: xpolicylab
  action_dt_s: 0.03333333333333333
  timeout_s: 2.0
  horizon_steps: 50
  inference_delay_s: 0.0
  startup_timeout_s: 120.0
  options:
    server: ws://127.0.0.1:8501
    request_timeout_s: 20.0
    group_order: [left_arm, right_arm]
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      cam_head: front_camera
      cam_left_wrist: left_camera
      cam_right_wrist: right_camera
    action_codec: joint_position

execution:
  runtime: rtc
  rtc:
    # Structurally feasible for H=50. These are not measured LingBot latency
    # values; live use remains blocked until the real YAM checkpoint is profiled.
    min_execute_steps: 20
    initial_delay_steps: 12
    delay_buffer_size: 10
    beta: 5.0
  executor: smooth
  commit_lead_s: 0.0
  max_plan_age_s: 2.0
  blend_steps: 8
  smooth:
    cutoff_hz: 8.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14
    gripper:
      mode: continuous
      group_indices:
        left_arm: 6
        right_arm: 6
      max_velocity: 1.0
      max_acceleration: 12.0
      closed_value: 0.0
      open_value: 1.0

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: LingBot-VLA2 YAM sampler RTC via XPolicyLab

recording:
  enabled: true
