# 实验入口：选择本体、policy 与运行方式。用 --local 指定工位，不自动连接设备。
run:
  task: pass the ball between the two grippers
  output_dir: ./data/experiments/umi-dp-tianji
  max_steps: 2400
robot:
  type: tianji_taccap
  config: ../../embodiment/robot/tianji_taccap.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 8
    right_arm: 8
  options:
    execute: false
    end_effector_control: false
    hardware:
      stale_timeout_s: 0.1  # 保留原传球实验的反馈超时；本体默认仍为 0.2 s。
sensors:
- name: tianji_wrist_history
  driver: manimux.integrations.umi_dp_tianji.camera_sensor:build_sensor
  options:
    camera_names:
    - left_wrist
    - right_wrist
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      left_wrist: left_wrist_camera
      right_wrist: right_wrist_camera
  service: camera
viewer:
  enabled: false
  robot: tianji-taccap
  policy_label: UMI DP Tianji
recording:
  enabled: true
policy:
  config: ../../policy/umi_dp/adapter/tianji_taccap.yaml
execution:
  config: ../runtime/tianji_taccap.yaml
policy_server:
  config: ../../policy/umi_dp/server.yaml
  task_name: pass_ball
camera_server:
  cameras:
    left_wrist:
      component: left_wrist_camera
      type: taccap
    right_wrist:
      component: right_wrist_camera
      type: taccap
