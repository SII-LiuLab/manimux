run:
  task: Pick the red ball up and place it into the box.
  output_dir: ./data/experiments/pi05-red-ball-box-step1000/autohorizon
  max_steps: 6000

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    move_to_start_on_connect: true
    start_duration_s: 3.0
    home_duration_s: 3.0
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xpolicylab_ws
  adapter: xpolicylab
  action_dt_s: 0.03333333333333333
  timeout_s: 30.0
  horizon_steps: 50
  inference_delay_s: 0.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_family: pi05
      task_name: pick_the_red_ball_up_and_place_it_into_the_box
      checkpoint_variant: pi05_yam_pick_red_ball_box_step_1000
      checkpoint_source: local_pi05_base_finetune_step_1000
      norm_stats_source: checkpoint_matched_yam_pick_red_ball_box_v1
      train_config_name: pi05_yam
      model_root: /home/ubuntu/manimux/checkpoints/finetuned/ziyang/pi05-yam-pick-red-ball-box-b384/1000
      norm_stats_path: /home/ubuntu/manimux/checkpoints/finetuned/ziyang/pi05-yam-pick-red-ball-box-b384/1000/assets/yam_pick_red_ball_box_v1
      action_horizon: 50
      num_steps: 10
  startup_timeout_s: 60.0
  options:
    server: ws://127.0.0.1:8500
    request_timeout_s: 120.0
    group_order: [left_arm, right_arm]
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      cam_head: front_camera
      cam_left_wrist: left_camera
      cam_right_wrist: right_camera

execution:
  runtime: autohorizon
  executor: smooth
  commit_lead_s: 0.0
  max_plan_age_s: 30.0
  blend_steps: 0
  smooth:
    cutoff_hz: 8.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: Pi05 YAM red-ball step-1000 AutoHorizon JAX port

recording:
  enabled: true
  video_fps: 30.0
