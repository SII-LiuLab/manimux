# Copy to a private station file. Serial numbers must match physical left/right.
robot:
  components:
    left_flexiv:
      serial: REPLACE_LEFT_SERIAL
      backend: flexivpy
      # sdk_path: /absolute/path/to/Python-3.12-flexivpy
      # interfaces: [192.168.2.110]  # Host NIC address, not robot IP; flat API only.
      enable_on_connect: false
    right_flexiv:
      serial: REPLACE_RIGHT_SERIAL
      backend: flexivpy
      enable_on_connect: false
    # Bind these after installing wrist cameras and selecting their device recipe.
    left_wrist_camera: {camera_serial: REPLACE_LEFT_CAMERA}
    right_wrist_camera: {camera_serial: REPLACE_RIGHT_CAMERA}
services:
  policy: {endpoint: 'ws://127.0.0.1:8500'}
  camera:
    endpoint: tcp://127.0.0.1:5555
    request_endpoint: tcp://127.0.0.1:5555
    bind_endpoint: tcp://0.0.0.0:5556
    bind_request_endpoint: tcp://0.0.0.0:5555
