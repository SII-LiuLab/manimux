# SAPolicy bottles via XPolicyLab WebSocket.
#
# Prerequisites:
#   1. SpatialAlign venv running:
#        python manimux/servers/sapolicy.py --config manimux/configs/policy/sapolicy/yam/abc-bottles.yaml
#   2. camera server at 640x480:
#        envs/yam/.venv/bin/manimux-camera-server --config manimux/configs/embodiment/sensor/cameras/yam_rgbd.yaml
#   3. viewer as in docs/sapolicy-yam-runbook.md
#
# Safety: connects paused when viewer.enabled; operator must Start at the robot.
run:
  task: put the plastic bottles in the bin
  output_dir: ./data
  # 100 Hz × 60 s. The old 1800 was sized for 30 Hz and ended the
  # episode before a grasp could start.
  max_control_steps: 6000

robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    move_to_start_on_connect: true
    start_joints:
      left_arm:
      - -0.21648737315937971
      - 0.7326237888151361
      - 0.7944228274967582
      - -0.2523460746166162
      - -0.11768520637826718
      - -0.3980697337300665
      - 0.9901674677653165
      right_arm:
      - -0.22564278629739754
      - 1.1377508201724265
      - 0.6948577096208126
      - -0.1802471961547223
      - -0.15392538338292816
      - -0.0791561760891124
      - 0.9990685638717227
    start_duration_s: 8.0
    home_duration_s: 5.0
    home_on_close: true
    execute: true
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.15
    camera_names: [front_camera, left_camera, right_camera]

policy:
  worker: xpolicylab_ws
  service: policy
  adapter:
    type: manimux.policy_adapter.sapolicy.yam:SAPolicyYamAdapter
    wire_image_hw: [168, 224]
    camera_map:
      top: front_camera
      left: left_camera
      right: right_camera
    model_from_kinematics:
      left_arm:
      - [1.0, 0.0000036732, 0.0000036732, 0.2522021]
      - [-0.0000036732, 1.0, -0.0000053072, 0.3100003422]
      - [-0.0000036732, 0.0000053072, 1.0, 0.7504985942]
      - [0.0, 0.0, 0.0, 1.0]
      right_arm:
      - [1.0, 0.0000036732, 0.0000036732, 0.2522021]
      - [-0.0000036732, 1.0, -0.0000053072, -0.3099996578]
      - [-0.0000036732, 0.0000053072, 1.0, 0.7504985942]
      - [0.0, 0.0, 0.0, 1.0]
    camera_intrinsics:
      top:
      - [394.7972412109375, 0.0, 317.49383544921875]
      - [0.0, 394.2569885253906, 241.21372985839844]
      - [0.0, 0.0, 1.0]
      left:
      - [394.2466125488281, 0.0, 319.2265930175781]
      - [0.0, 393.6261901855469, 241.67579650878906]
      - [0.0, 0.0, 1.0]
      right:
      - [394.0639953613281, 0.0, 321.9771728515625]
      - [0.0, 393.66046142578125, 244.92794799804688]
      - [0.0, 0.0, 1.0]
    kinematics: yam
    kinematics_options:
      arm_type: yam
      gripper_type: linear_4310
      num_arm_joints: 6
      pos_threshold: 0.004
      ori_threshold: 0.002
      max_iters: 300

  action_dt_s: 0.03333333333333333
  timeout_s: 1.0
  horizon_policy_steps: 16
  inference_delay_s: 0.0
  startup_timeout_s: 180.0
  options:
    connect_timeout_s: 5.0
    request_timeout_s: 1.0
viewer:
  enabled: true
  robot: yam
  policy_label: SAPolicy bottles 3cam TCP · XPolicyLab WS

recording:
  enabled: true
  video_fps: 30.0
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
inference:
  algorithm: manimux
  config: ../../inference/yam_manimux_single.yaml
  refill_threshold_s: 0.2
  max_plan_age_s: 2.0
  blend_policy_steps: 4
executor:
  type: smooth
  config: ../../executor/yam_smooth_arm_standard.yaml
  smooth:
    position_limit_abs: 4.0
    gripper:
      close_threshold: 0.55
      open_threshold: 0.85
      min_closed_s: 10.0
      open_confirm_s: 0.5
      max_velocity: 3.0
      max_acceleration: 12.0
      closed_value: 0.0
      open_value: 1.0
