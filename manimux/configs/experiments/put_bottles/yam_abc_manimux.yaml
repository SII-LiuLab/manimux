  # ABC 的 prompt 走 CLIP 文本编码，措辞要贴近训练时的任务名。
  # 一次 rollout 最多执行的控制步数；达到后自动回 Home 并退出。
  # ABC 的训练数据是 30 Hz，所以相邻两个 Policy 点间隔 1/30 秒。
      # 左边是 ABC 的相机名，右边是 camera server 里的相机名。
    # 流匹配采样步数；越小越快，参考实现用 10（低延迟时用 5）。
  # ABC-DiT 的 chunk_length 固定为 30。
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
run:
  task: put the plastic bottles in the bin
  output_dir: /home/ubuntu/sa/rollouts/abc_official_bottles
  max_control_steps: 1600
robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 30.0
  options:
    move_to_start_on_connect: true
    start_joints:
      left_arm:
      - -0.21648737315937971
      - 0.7326237888151361
      - 0.7944228274967582
      - -0.2523460746166162
      - -0.11768520637826718
      - -0.3980697337300665
      - 0.9901674677653165
      right_arm:
      - -0.22564278629739754
      - 1.1377508201724265
      - 0.6948577096208126
      - -0.1802471961547223
      - -0.15392538338292816
      - -0.0791561760891124
      - 0.9990685638717227
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: true
    execute: true
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names:
    - left_camera
    - front_camera
    - right_camera
policy:
  worker: abc_http
  service: policy_abc
  adapter:
    type: manimux.policy_adapter.abc_yam:AbcYamAdapter
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
  action_dt_s: 0.033333
  timeout_s: 1.0
  horizon_policy_steps: 30
  inference_delay_s: 0.0
  options:
    diffusion_steps: 10
viewer:
  enabled: true
  robot: yam
  policy_label: ABC
recording:
  enabled: true
  video_fps: 30.0
inference:
  algorithm: manimux
  config: ../../inference/yam_manimux_single.yaml
  refill_threshold_s: 0.4
  max_plan_age_s: 1.0
  blend_policy_steps: 0
executor:
  type: direct
