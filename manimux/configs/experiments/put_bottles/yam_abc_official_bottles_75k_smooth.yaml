# ABC joint output with the working SA shared executor settings.
# No IK or independent IK decoding; 30 predicted rows, source prefix 25.
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
run:
  task: put the plastic bottles in the bin
  output_dir: ./data/abc/official_bottles_75k_smooth_h25
  max_control_steps: 18000
  experiment_mode: false
robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    move_to_start_on_connect: false
    start_joints:
      left_arm:
      - -0.21648737315937971
      - 0.7326237888151361
      - 0.7944228274967582
      - -0.2523460746166162
      - -0.11768520637826718
      - -0.3980697337300665
      - 0.9901674677653165
      right_arm:
      - -0.22564278629739754
      - 1.1377508201724265
      - 0.6948577096208126
      - -0.1802471961547223
      - -0.15392538338292816
      - -0.0791561760891124
      - 0.9990685638717227
    start_duration_s: 8.0
    home_duration_s: 5.0
    home_on_close: true
    execute: true
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.15
    camera_names:
    - front_camera
    - left_camera
    - right_camera
policy:
  worker: abc_http
  service: policy_abc
  adapter:
    type: manimux.policy_adapter.abc_yam:AbcYamAdapter
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
  action_dt_s: 0.03333333333333333
  timeout_s: 1.0
  horizon_policy_steps: 30
  options:
    diffusion_steps: 10
viewer:
  enabled: true
  robot: yam
  policy_label: ABC DiT bottles 75k | shared braking + gripper | prefix 25
recording:
  enabled: true
  video_fps: 30.0
inference:
  algorithm: manimux
  config: ../../inference/yam_manimux_single.yaml
  refill_threshold_s: 0.3
  max_plan_age_s: 2.0
  blend_policy_steps: 4
  max_chunk_policy_steps: 25
  independent_group_decoding: false
  decode_budget_ms: 40.0
executor:
  type: smooth
  config: ../../executor/yam_smooth_braking.yaml
