# ABC 的 prompt 走 CLIP 文本编码，措辞要贴近训练时的任务名。
  # 一次 rollout 最多执行的控制步数；达到后自动回 Home 并退出。
  # ABC 的训练数据是 30 Hz，所以相邻两个 Policy 点间隔 1/30 秒。
      # 左边是 ABC 的相机名，右边是 camera server 里的相机名。
    # 流匹配采样步数；越小越快，参考实现用 10（低延迟时用 5）。
    # RTC 的 VJP 引导让推理慢约 1.4x；降到论文默认的 5 步压回延迟。
  # ABC-DiT 的 chunk_length 固定为 30。
# Inference controls requests and chunk handoff; the executor controls smoothing and limits.
    # 开始下一次推理前至少执行多少步。实际执行步长 = max(min_execute_policy_steps, d)。
    # 首次推理还没有实测延迟时的初值（控制步数）。
    # 延迟预测取最近 10 次实测值的最大值（保守）。
    # 引导权重上限。按 (t²+(1−t)²)/(t(1−t)) 在 t=1/steps 处取值：
    # 5 步采样 → 约 4.25。和下面的 diffusion_steps: 5 配套。
run:
  task: put the bottle into the box.
  output_dir: ./data
  max_control_steps: 1600

robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 30.0
  options:
    move_to_start_on_connect: true
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: true
    start_joints:
      left_arm:
      - -0.6094071869993112
      - 0.5834668497749291
      - 0.8424887464713517
      - -1.0168230716411042
      - -0.11081864652475382
      - -0.45796139467459973
      - 0.9969282527609157
      right_arm:
      - 0.321393148699169
      - 0.5643930724040587
      - 0.8009079118028541
      - -1.01796749828336
      - -0.18024719615472584
      - 0.4129472800793472
      - 0.994773647405226
    execute: true
  type: yam

sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: abc_http
  service: policy_abc
  adapter:
    type: manimux.policy_adapter.abc_yam:AbcYamAdapter
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
  action_dt_s: 0.033333
  timeout_s: 1.0
  horizon_policy_steps: 30
  inference_delay_s: 0.0
  options:
    diffusion_steps: 5

viewer:
  enabled: true
  robot: yam
  policy_label: ABC

recording:
  enabled: true

inference:
  algorithm: rtc
  config: ../../../inference/yam_rtc_base.yaml
  rtc:
    min_execute_policy_steps: 15
    initial_delay_policy_steps: 8
    beta: 4.25
  max_plan_age_s: 1.0
  blend_policy_steps: 0

executor:
  type: direct

# Device serials and service addresses come from the shared station file.
camera_server:
  config: ../../../embodiment/sensor/cameras/realsense_3_views.yaml
