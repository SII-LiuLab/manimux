# Pair with official_bottles_75k/bottles_75k.pt (step 75000).
# Its embedded normalization matches the adjacent norm_stats.json.
# Inference controls requests and chunk handoff; the executor controls smoothing and limits.
  # Cap the source prefix to 15 of 30 rows (0.5 s), before latency trimming.
run:
  task: put the plastic bottles in the bin
  output_dir: ./data/abc/official_bottles_75k
  max_control_steps: 5400

robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 30.0
  options:
    move_to_start_on_connect: false
    home_duration_s: 5.0
    home_on_close: true
    execute: true
  type: yam

sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: abc_http
  service: policy_abc
  adapter:
    type: manimux.policy_adapter.abc_yam:AbcYamAdapter
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
  action_dt_s: 0.03333333333333333
  timeout_s: 1.0
  horizon_policy_steps: 30
  options:
    diffusion_steps: 10

viewer:
  enabled: true
  robot: yam
  policy_label: ABC official bottles 75k

recording:
  enabled: true
  video_fps: 30.0

inference:
  algorithm: manimux
  config: ../../../inference/yam_manimux_single.yaml
  refill_threshold_s: 0.3
  max_plan_age_s: 1.0
  blend_policy_steps: 0
  max_chunk_policy_steps: 15

executor:
  type: direct

# Device serials and service addresses come from the shared station file.
camera_server:
  config: ../../../embodiment/sensor/cameras/realsense_3_views.yaml
