run:
  task: put the plastic bottles in the bin
  output_dir: ./data/sapolicy/teleopMV51/top
  max_steps: 18000
  experiment_mode: false
robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    move_to_start_on_connect: false
    start_joints:
      left_arm:
      - -0.21648737315937971
      - 0.7326237888151361
      - 0.7944228274967582
      - -0.2523460746166162
      - -0.11768520637826718
      - -0.3980697337300665
      - 0.9901674677653165
      right_arm:
      - -0.22564278629739754
      - 1.1377508201724265
      - 0.6948577096208126
      - -0.1802471961547223
      - -0.15392538338292816
      - -0.0791561760891124
      - 0.9990685638717227
    start_duration_s: 8.0
    home_duration_s: 5.0
    home_on_close: true
    execute: true
    component_hardware:
      left_yam:
        channel: can_left
      right_yam:
        channel: can_right
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  options:
    endpoint: tcp://127.0.0.1:5555
    request_timeout_ms: 500
    max_frame_age_sec: 0.15
    camera_names:
    - front_camera
    - left_camera
    - right_camera
policy:
  worker: xpolicylab_ws
  adapter:
    type: manimux.policy_adapter.sapolicy.yam:SAPolicyYamAdapter
    group_order:
    - left_arm
    - right_arm
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    wire_image_hw:
    - 168
    - 224
    camera_map:
      top: front_camera
      left: left_camera
      right: right_camera
    model_from_kinematics:
      left_arm:
      - - 1.0
        - 3.6732e-06
        - 3.6732e-06
        - 0.2522021
      - - -3.6732e-06
        - 1.0
        - -5.3072e-06
        - 0.3100003422
      - - -3.6732e-06
        - 5.3072e-06
        - 1.0
        - 0.7504985942
      - - 0.0
        - 0.0
        - 0.0
        - 1.0
      right_arm:
      - - 1.0
        - 3.6732e-06
        - 3.6732e-06
        - 0.2522021
      - - -3.6732e-06
        - 1.0
        - -5.3072e-06
        - -0.3099996578
      - - -3.6732e-06
        - 5.3072e-06
        - 1.0
        - 0.7504985942
      - - 0.0
        - 0.0
        - 0.0
        - 1.0
    camera_intrinsics:
      top:
      - - 394.7972412109375
        - 0.0
        - 317.49383544921875
      - - 0.0
        - 394.2569885253906
        - 241.21372985839844
      - - 0.0
        - 0.0
        - 1.0
      left:
      - - 394.2466125488281
        - 0.0
        - 319.2265930175781
      - - 0.0
        - 393.6261901855469
        - 241.67579650878906
      - - 0.0
        - 0.0
        - 1.0
      right:
      - - 394.0639953613281
        - 0.0
        - 321.9771728515625
      - - 0.0
        - 393.66046142578125
        - 244.92794799804688
      - - 0.0
        - 0.0
        - 1.0
    kinematics: yam
    kinematics_options:
      arm_type: yam
      gripper_type: linear_4310
      num_arm_joints: 6
      pos_threshold: 0.004
      ori_threshold: 0.002
      max_iters: 300
      recovery_ori_threshold: 0.0872664626
      recovery_max_joint_delta: 0.35
    action_space: joint_position
    view_profile: top
  action_dt_s: 0.03333333333333333
  timeout_s: 5.0
  horizon_steps: 50
  inference_delay_s: 0.0
  startup_timeout_s: 180.0
  options:
    server: ws://127.0.0.1:8510
    connect_timeout_s: 5.0
    request_timeout_s: 5.0
  action_decoding: process
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_name: SAPolicy
      action_horizon: 50
      checkpoint_source: sha256:49505482141081c6dd65e93ca1a4774c98a87556ad40789c6d5e5fb6a66e3011
viewer:
  enabled: true
  robot: yam
  policy_label: SAPolicy MV51 RAW | top + wrists | chunk 25 + lowpass 8Hz
recording:
  enabled: true
  video_fps: 30.0
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
inference:
  algorithm: manimux
  inference_schedule: single_inflight
  refill_threshold_s: 0.2
  commit_lead_s: 0.0
  max_plan_age_s: 2.0
  blend_steps: 4
  max_chunk_steps: 25
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    tracking_mode: legacy
    # Explicit null keeps software rate caps disabled.
    max_velocity:
    max_acceleration:
    position_limit_abs: 3.14
    gripper:
      mode: continuous
      group_indices:
        left_arm: 6
        right_arm: 6
      max_velocity:
      max_acceleration:
      max_closing_velocity:
      closed_value: 0.0
      open_value: 1.0
