# SAPolicy tcp_rot20 (RAW 50k, ABC bottles real+sim) zero-shot put-bottles with inference-time RTC, no target z bias.
# Policy server: manimux/configs/policy/sapolicy/yam/tcp_rot20/raw-50k.yaml (port 8510).
# Deployment (2026-10-15 diagnosis): stock grasp_site + z +2.2 cm plate (model_from_kinematics). Training EE
#   labels are the official station MJCF {side}_grasp_site for every episode; this chain matches it to <0.1 mm.
# Start: ABC-130k bottles 'ready' cluster shifted 2.2 cm down (same joints as ABC-DiT mount22), so the model
#   sees the exact ABC ready pose. move_to_start_on_connect.
# Inference: inference-time RTC instead of async (see the inference section); SA plans its descent in rows ~36-49;
#   rows keeps postponing it), blend 4, refill 0.2 s, max plan age 2.5 s (48 rows = 1.6 s + latency).
# Executor: smooth braking 8 Hz with arm caps 0.6 rad/s, 1.5 rad/s^2 (without caps chunk seams reach the motors).
# IK decoding in a separate process (inline IK stalled the 100 Hz loop 30-100 ms per handoff).
# SAPolicy backend has no inference_seed; repeated requests differ 3-10 cm at the chunk end.
run:
  task: put the plastic bottles in the bin
  output_dir: ./data/experiments/sapolicy-put-bottles-tcp-rot20-step50000/rtc46-stocksite-z22
  max_control_steps: 12000
  warmup_before_start: false
  experiment_template:
    name: Put bottles - ten layouts, three repeats
    layout_ids: ['01', '02', '03', '04', '05', '06', '07', 08, 09, '10']
    repeats: 3
    require_reference: true
  sensor_reading: {mode: background, poll_hz: 100.0, max_frame_age_s: 0.5, startup_timeout_s: 5.0, shutdown_timeout_s: 2.0}
evaluation: {config: ../../../evaluation/put_bottles.yaml}
robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    move_to_start_on_connect: true
    # Same as ABC-DiT mount22: ABC ready cluster shifted 2.2 cm down, so with z +2.2 cm the model sees
    # exactly the ABC ready pose (raw ABC ready joints would read 2.2 cm high).
    start_joints:
      left_arm: [-0.044, 1.675, 0.354, 1.031, -0.168, -0.006, 1.0]
      right_arm: [0.015, 1.651, 0.353, 0.984, 0.081, 0.032, 1.0]
    start_duration_s: 4.0
    home_duration_s: 2.0
    home_on_close: true
    execute: true
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [d405_left, d405_front, d405_right]
policy:
  worker: xpolicylab_ws
  service: policy_sapolicy
  adapter:
    type: manimux.policy_adapter.sapolicy.yam:SAPolicyYamAdapter
    wire_image_hw: [168, 224]
    camera_map: {top: d405_front, left: d405_left, right: d405_right}
    model_from_kinematics:
      left_arm:
      - [1.0, 3.6732e-06, 3.6732e-06, 0.2522021]
      - [-3.6732e-06, 1.0, -5.3072e-06, 0.3100003422]
      - [-3.6732e-06, 5.3072e-06, 1.0, 0.7724985942]
      - [0.0, 0.0, 0.0, 1.0]
      right_arm:
      - [1.0, 3.6732e-06, 3.6732e-06, 0.2522021]
      - [-3.6732e-06, 1.0, -5.3072e-06, -0.3099996578]
      - [-3.6732e-06, 5.3072e-06, 1.0, 0.7724985942]
      - [0.0, 0.0, 0.0, 1.0]
    camera_intrinsics:
      top:
      - [394.7972412109375, 0.0, 317.49383544921875]
      - [0.0, 394.2569885253906, 241.21372985839844]
      - [0.0, 0.0, 1.0]
      left:
      - [394.2466125488281, 0.0, 319.2265930175781]
      - [0.0, 393.6261901855469, 241.67579650878906]
      - [0.0, 0.0, 1.0]
      right:
      - [394.0639953613281, 0.0, 321.9771728515625]
      - [0.0, 393.66046142578125, 244.92794799804688]
      - [0.0, 0.0, 1.0]
    kinematics: yam
    kinematics_options: {arm_type: yam, gripper_type: linear_4310, num_arm_joints: 6, pos_threshold: 0.004, ori_threshold: 0.002,
      max_iters: 300, recovery_ori_threshold: 0.0872664626, recovery_max_joint_delta: 0.35}
    action_space: joint_position
    view_profile: top
  action_dt_s: 0.03333333333333333
  timeout_s: 2.0
  horizon_policy_steps: 50
  inference_delay_s: 0.0
  startup_timeout_s: 180.0
  options: {connect_timeout_s: 5.0, request_timeout_s: 10.0}
  action_decoding: process
  expected_backend:
    server: xpolicylab_policy_server
    model: {policy_name: SAPolicy, action_horizon: 50, checkpoint_source: 'sha256:d84e94f23eadb56d28d4d1e73f5e98ae6b0e15bb404799b86ccaa2b032825a3f'}
robogui: {enabled: true, robot: yam, policy_label: SAPolicy tcp_rot20 RAW 50k - ManiMux RTC min exec 46 beta 5 | ABC ready start |
    braking arm 0.6/1.5+blend4 | stock site (as ABC-DiT) | z+2.2cm | IK process}
recording: {enabled: true, video_fps: 30.0}
inference:
  # Inference-time RTC (VJP guidance toward the still-executing old plan; tcp_rot20's source has the RTC patch,
  # caps1010 3task does not). For RTC, chunk_policy_steps is the MINIMUM execution: the runtime replans at
  # min(max(46, d), 50 - d) source rows, d = forecast latency in rows (~4), so the late descent (rows 36-49) runs.
  algorithm: rtc
  config: ../../../inference/yam_rtc_base.yaml
  max_plan_age_s: 2.5
  blend_policy_steps: 4
  chunk_policy_steps: 46
  rtc:
    initial_delay_policy_steps: 4
    beta: 5.0                 # SA's validated guidance cap (MV51 RTC)
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    tracking_mode: braking
    max_velocity: 0.6
    max_acceleration: 1.5
    position_limit_abs: 3.14
    grasp_guard: null
    release_guard: null
    gripper:
      mode: continuous
      max_velocity: null
      max_acceleration: null
      max_closing_velocity: null

camera_server: {config: ../../../embodiment/sensor/cameras/realsense_3_views.yaml}
