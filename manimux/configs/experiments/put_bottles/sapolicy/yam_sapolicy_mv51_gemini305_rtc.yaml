run:
  task: put the plastic bottles in the bin
  output_dir: ./data/sapolicy/teleopMV51/gemini305-rtc
  max_control_steps: 18000
  experiment_mode: false

robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    move_to_start_on_connect: false
    start_joints:
      left_arm:
      - -0.21648737315937971
      - 0.7326237888151361
      - 0.7944228274967582
      - -0.2523460746166162
      - -0.11768520637826718
      - -0.3980697337300665
      - 0.9901674677653165
      right_arm:
      - -0.22564278629739754
      - 1.1377508201724265
      - 0.6948577096208126
      - -0.1802471961547223
      - -0.15392538338292816
      - -0.0791561760891124
      - 0.9990685638717227
    start_duration_s: 8.0
    home_duration_s: 5.0
    home_on_close: true
    execute: true
  type: yam

sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.15
    camera_names: [left_camera, right_camera]
- name: external_camera
  driver: camera_server
  service: external_camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.15
    camera_names: [gemini305]

policy:
  worker: xpolicylab_ws
  service: policy_sapolicy
  adapter:
    type: manimux.policy_adapter.sapolicy.yam:SAPolicyYamAdapter
    wire_image_hw:
    - 168
    - 224
    camera_map:
      top: gemini305
      left: left_camera
      right: right_camera
    model_from_kinematics:
      left_arm:
      - - 1.0
        - 3.6732e-06
        - 3.6732e-06
        - 0.2522021
      - - -3.6732e-06
        - 1.0
        - -5.3072e-06
        - 0.3100003422
      - - -3.6732e-06
        - 5.3072e-06
        - 1.0
        - 0.7504985942
      - - 0.0
        - 0.0
        - 0.0
        - 1.0
      right_arm:
      - - 1.0
        - 3.6732e-06
        - 3.6732e-06
        - 0.2522021
      - - -3.6732e-06
        - 1.0
        - -5.3072e-06
        - -0.3099996578
      - - -3.6732e-06
        - 5.3072e-06
        - 1.0
        - 0.7504985942
      - - 0.0
        - 0.0
        - 0.0
        - 1.0
    camera_intrinsics:
      top:
      - - 394.7972412109375
        - 0.0
        - 317.49383544921875
      - - 0.0
        - 394.2569885253906
        - 241.21372985839844
      - - 0.0
        - 0.0
        - 1.0
      left:
      - - 394.2466125488281
        - 0.0
        - 319.2265930175781
      - - 0.0
        - 393.6261901855469
        - 241.67579650878906
      - - 0.0
        - 0.0
        - 1.0
      right:
      - - 394.0639953613281
        - 0.0
        - 321.9771728515625
      - - 0.0
        - 393.66046142578125
        - 244.92794799804688
      - - 0.0
        - 0.0
        - 1.0
    kinematics: yam
    kinematics_options:
      arm_type: yam
      gripper_type: linear_4310
      num_arm_joints: 6
      pos_threshold: 0.004
      ori_threshold: 0.002
      max_iters: 300
      recovery_ori_threshold: 0.0872664626
      recovery_max_joint_delta: 0.35
    action_space: joint_position
    view_profile: gemini305
  action_dt_s: 0.03333333333333333
  timeout_s: 5.0
  horizon_policy_steps: 50
  inference_delay_s: 0.0
  startup_timeout_s: 180.0
  options:
    connect_timeout_s: 5.0
    request_timeout_s: 5.0
  action_decoding: process
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_name: SAPolicy
      action_horizon: 50
      checkpoint_source: sha256:49505482141081c6dd65e93ca1a4774c98a87556ad40789c6d5e5fb6a66e3011

viewer:
  enabled: true
  robot: yam
  policy_label: SAPolicy MV51 RAW | gemini305 + wrists | RTC min 25 + lowpass 8Hz

recording:
  enabled: true
  video_fps: 30.0

# Inference controls requests and chunk handoff; the executor controls smoothing and limits.
inference:
  algorithm: rtc
  config: ../../../inference/yam_rtc_base.yaml
  max_plan_age_s: 2.0
  blend_policy_steps: 4
  chunk_policy_steps: 25
  rtc:
    initial_delay_policy_steps: 4
    beta: 5.0

executor:
  type: smooth
  config: ../../../executor/yam_smooth_unbounded.yaml
