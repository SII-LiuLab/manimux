# Gripper geometry: ABC ~59% crank_4310 (fingertips offset +4.1 cm along grasp_site x), ours linear_4310 (centred).
#   Virtual grasp_site = true site - 4.1 cm along site x via kinematics_options.assets_root (policy/sapolicy/yam/tcp_rot20/crank_site_assets).
# Inference = ManiMux async as in the Sep MV51 runs (prefix 40 [MV51 used 25], blend 4, refill 0.2 s).
# SAPolicy tcp_rot20 put-bottles evaluation, aligned to Pi05 Joint 30k RTC
# (put_bottles/pi05/yam_pi05_rtc_joint_step30000.yaml; docs/experiments.md §5).
# Model-specific: SAPolicy adapter/camera map, run.task prompt, startup_timeout_s, expected_backend.
# Model-specific start: ABC-130k bottles real 'ready' pose cluster (median of 58/200 sampled
#   episodes, MCAP first frame); Pi05 starts at zero, which never occurs in ABC data. start_duration 4 s.
# Model-specific exec: 40 of 50 steps per chunk (was 25; fewer mid-air re-decisions), as in the training owner's sim eval (Pi05 uses 16).
# Model-specific smoothing (deviates from Pi05 Direct/blend0): braking tracking with the Sep MV51 arm limits (0.6 rad/s, 1.5 rad/s^2);
#   gripper unchanged (continuous, no caps, no guards); no control_profile, as in the MV51 configs
#   + blend_policy_steps 4. Table offset: ABC YAM base mesh bottom = table (z 0.750);
#   z +0.022: 2.2 cm plate verified (J2 axis height and zero-pose fingertip height match FK); gains = i2rt defaults as ABC.
# IK decoding runs in a separate process (inline IK stalled the 100 Hz loop 30-100 ms per handoff);
#   pre-Start warmup is off because it requires inline decoding.
# Not aligned yet: SAPolicy backend has no inference_seed / seeded RESET.
# Policy server: manimux/configs/policy/sapolicy/yam/tcp_rot20/raw-50k.yaml (port 8510); docs/deployment/sapolicy-yam.md "tcp_rot20".
run:
  task: put the plastic bottles in the bin
  output_dir: ./data/experiments/sapolicy-put-bottles-tcp-rot20-step50000/async40-cranksite-z22
  max_control_steps: 12000
  warmup_before_start: false
  experiment_template:
    name: Put bottles - ten layouts, three repeats
    layout_ids: ['01', '02', '03', '04', '05', '06', '07', 08, 09, '10']
    repeats: 3
    require_reference: true
  sensor_reading: {mode: background, poll_hz: 100.0, max_frame_age_s: 0.5, startup_timeout_s: 5.0, shutdown_timeout_s: 2.0}
evaluation: {config: ../../../evaluation/put_bottles.yaml}
robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    move_to_start_on_connect: true
    start_joints:
      left_arm: [-0.044, 1.552, 0.383, 0.878, -0.168, -0.006, 1.0]
      right_arm: [0.015, 1.53, 0.384, 0.831, 0.081, 0.032, 1.0]
    start_duration_s: 4.0
    home_duration_s: 2.0
    home_on_close: true
    execute: true
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [d405_left, d405_front, d405_right]
policy:
  worker: xpolicylab_ws
  service: policy_sapolicy
  adapter:
    type: manimux.policy_adapter.sapolicy.yam:SAPolicyYamAdapter
    wire_image_hw: [168, 224]
    camera_map: {top: d405_front, left: d405_left, right: d405_right}
    model_from_kinematics:
      left_arm:
      - [1.0, 3.6732e-06, 3.6732e-06, 0.2522021]
      - [-3.6732e-06, 1.0, -5.3072e-06, 0.3100003422]
      - [-3.6732e-06, 5.3072e-06, 1.0, 0.7724985942]
      - [0.0, 0.0, 0.0, 1.0]
      right_arm:
      - [1.0, 3.6732e-06, 3.6732e-06, 0.2522021]
      - [-3.6732e-06, 1.0, -5.3072e-06, -0.3099996578]
      - [-3.6732e-06, 5.3072e-06, 1.0, 0.7724985942]
      - [0.0, 0.0, 0.0, 1.0]
    camera_intrinsics:
      top:
      - [394.7972412109375, 0.0, 317.49383544921875]
      - [0.0, 394.2569885253906, 241.21372985839844]
      - [0.0, 0.0, 1.0]
      left:
      - [394.2466125488281, 0.0, 319.2265930175781]
      - [0.0, 393.6261901855469, 241.67579650878906]
      - [0.0, 0.0, 1.0]
      right:
      - [394.0639953613281, 0.0, 321.9771728515625]
      - [0.0, 393.66046142578125, 244.92794799804688]
      - [0.0, 0.0, 1.0]
    kinematics: yam
    kinematics_options: {arm_type: yam, gripper_type: linear_4310, num_arm_joints: 6, pos_threshold: 0.004, ori_threshold: 0.002,
      max_iters: 300, recovery_ori_threshold: 0.0872664626, recovery_max_joint_delta: 0.35, assets_root: manimux/configs/policy/sapolicy/yam/tcp_rot20/crank_site_assets}
    action_space: joint_position
    view_profile: top
  action_dt_s: 0.03333333333333333
  timeout_s: 2.0
  horizon_policy_steps: 50
  inference_delay_s: 0.0
  startup_timeout_s: 180.0
  options: {connect_timeout_s: 5.0, request_timeout_s: 10.0}
  action_decoding: process
  expected_backend:
    server: xpolicylab_policy_server
    model: {policy_name: SAPolicy, action_horizon: 50, checkpoint_source: 'sha256:d84e94f23eadb56d28d4d1e73f5e98ae6b0e15bb404799b86ccaa2b032825a3f'}
robogui: {enabled: true, robot: yam, policy_label: SAPolicy tcp_rot20 RAW 50k - ManiMux async prefix 40 | ABC ready start |
    braking arm 0.6/1.5+blend4 | crank-site -4.1cm | z+2.2cm | IK process}
recording: {enabled: true, video_fps: 30.0}
inference: {algorithm: manimux, config: ../../../inference/yam_manimux_single.yaml, refill_threshold_s: 0.2,
  max_plan_age_s: 2.0, blend_policy_steps: 4, max_chunk_policy_steps: 40}
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    tracking_mode: braking
    max_velocity: 0.6
    max_acceleration: 1.5
    position_limit_abs: 3.14
    gripper: {mode: continuous, max_velocity: null, max_acceleration: null, max_closing_velocity: null, closed_value: 0.0,
      open_value: 1.0}
camera_server: {config: ../../../embodiment/sensor/cameras/realsense_3_views.yaml}
