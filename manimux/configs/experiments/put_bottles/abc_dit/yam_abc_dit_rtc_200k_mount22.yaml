# VARIANT of yam_abc_dit_rtc_200k.yaml with mount compensation: our YAM bases stand on a 2.2 cm
# plate, ABC's sit on the table, so identical joints put our gripper 2.2 cm higher above the table
# (2026-10-07 rollout: grasp-site z in base frame 0.044 m = ABC's 0.045 m, grippers closed above
# bottles). MountOffsetJointAdapter shifts poses by base_offset_m via FK/IK: state and PAINT prefix
# robot -> model (+2.2 cm), actions model -> robot (-2.2 cm). Start pose = ABC ready pose shifted
# the same way, so the model still observes the ABC ready pose. Everything else is unchanged:
# ABC-DiT XL 200k (official pretrain, zero-shot) put-bottles with the OFFICIAL ABC RTC: training-time
# action-prefix conditioning, deploy README bottles command --rtc-prefix-length=4
# --rtc-inference-lead-steps=7 --execute-chunk-dim=16 --diffusion-steps=10.
# Scheduled by ManiMux's existing PAINT strategy: observe at chunk row 16 (= execute 16), send the
# 7 rows that run during inference (lead 7, kept fixed by a 1000-entry delay buffer seeded with 7);
# the ABC_DiT server conditions on their last 4 (prefix 4) and switches to new actions at row 23,
# exactly upstream _RTCManager. Only the first chunk differs (upstream observes at row 9).
# Pi05 Joint 30k RTC (yam_pi05_rtc_joint_step30000.yaml) uses inference-time PiGDM guidance instead.
# Otherwise aligned to Pi05 (Direct, unlimited profile, blend 0, 100 Hz, 12000 steps).
# Model-specific: horizon 30,
#   ABC-130k bottles 'ready' start pose (Pi05 starts at zero, ~3 sigma outside ABC's state stats),
#   run.task = official ABC bottles prompt, policy service/port, startup_timeout_s, expected_backend.
control_profile: ../../../embodiment/robot/yam_control_unlimited.yaml

run:
  task: throw plastic bottles in bin
  output_dir: ./data/experiments/abc-dit-put-bottles-pretrained-200k/rtc-abc-prefix-mount22
  max_control_steps: 12000
  warmup_before_start: true
  experiment_template:
    name: Put bottles - ten layouts, three repeats
    layout_ids: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
    repeats: 3
    require_reference: true
  sensor_reading:
    mode: background
    poll_hz: 100.0
    max_frame_age_s: 0.5
    startup_timeout_s: 5.0
    shutdown_timeout_s: 2.0

evaluation:
  config: ../../../evaluation/put_bottles.yaml

robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0  # Interpolate 30 Hz action points for 100 Hz execution.
  options:
    move_to_start_on_connect: true
    # ABC-130k bottles real 'ready' cluster, shifted 2.2 cm down in the base frame (robot frame).
    start_joints:
      left_arm: [-0.044, 1.675, 0.354, 1.031, -0.168, -0.006, 1.0]
      right_arm: [0.015, 1.651, 0.353, 0.984, 0.081, 0.032, 1.0]
    start_duration_s: 4.0
    home_duration_s: 2.0
    home_on_close: true
    execute: true
  type: yam

sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [d405_left, d405_front, d405_right]

policy:
  action_dt_s: 0.03333333333333333  # ABC data and model run at 30 Hz.
  worker: xpolicylab_ws
  service: policy_abc_dit
  adapter:
    type: manimux.policy_adapter.joint_mount:MountOffsetJointAdapter
    # Robot base relative to the model's training base (m, arm base frame).
    base_offset_m: {left_arm: [0.0, 0.0, 0.022], right_arm: [0.0, 0.0, 0.022]}
    # Wire names; the ABC_DiT server maps them to its top/left/right camera keys.
    camera_map:
      cam_head: d405_front
      cam_left_wrist: d405_left
      cam_right_wrist: d405_right

  timeout_s: 2.0
  horizon_policy_steps: 30
  inference_delay_s: 0.0
  startup_timeout_s: 120.0
  options:
    action_format: joint
    request_timeout_s: 10.0

robogui:
  enabled: true
  robot: yam
  policy_label: ABC-DiT XL 200k pretrain (zero-shot) - official ABC RTC (prefix 4, lead 7, exec 16) | fast | mount +2.2 cm

recording:
  enabled: true
  video_fps: 30.0

inference:
  algorithm: paint
  config: ../../../inference/yam_paint.yaml
  paint:
    execution_policy_steps: 16     # --execute-chunk-dim=16
    # --rtc-inference-lead-steps=7. With the official fast path obs->commit is ~92 ms (+~35 ms
    # inline FK/IK here); a chunk later than 7 steps is rejected and PAINT then stalls.
    initial_delay_policy_steps: 7
    delay_buffer_size: 1000        # keep the lead at 7 for the whole rollout

executor:
  type: direct

policy_server:
  config: ../../../policy/abc_dit/yam/put-bottles/pretrained-200k.yaml

camera_server:
  config: ../../../embodiment/sensor/cameras/realsense_3_views.yaml
