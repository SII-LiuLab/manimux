# Teleop-derived differential IK runs on each control tick with measured feedback.
_base_: ee_umi_serial.yaml
run:
  output_dir: ./data/experiments/pi05-flexiv-stack-cube-ee-umi-step29999/diffik-serial
  control_timing: true
robot:
  control_hz: 100.0
policy:
  action_decoding: inline
  adapter:
    parallel_ik: false
inference:
  blend_mode: linear
  handoff: blend
executor:
  type: direct
execution:
  ik:
    mode: step
    solver: differential
    budget_ms: 5.0
    failure_policy: hold_last_valid
    differential:
      # Collection algorithm limits in SI units. Executor limits still apply.
      max_joint_velocity_rad_s: 0.9047786842338604  # 51.84 deg/s
      max_linear_m_s: 0.2592
      max_angular_rad_s: 1.0857344210806326  # 62.208 deg/s
      max_step_dt_s: 0.016
      tracking_limit_rad: 0.08726646259971647  # 5 degrees
      slowdown_zone_rad: 0.17453292519943295  # 10 degrees
      avoidance_zone_rad: 0.4363323129985824  # 25 degrees
      nullspace_rate_rad_s: 0.3490658503988659  # 20 deg/s
      nullspace_enabled: true
      joint_margin_rad: 0.0
      rotation_weight_m: 0.2
      damping: 0.01
robogui:
  policy_label: Pi05 Flexiv EE UMI 29999 - Serial diffIK (read-only)
