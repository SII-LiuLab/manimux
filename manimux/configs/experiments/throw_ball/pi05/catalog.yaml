policy_services:
  Pi05 / Throw Ball Native H50 / 29999:
    cwd: ../../../../..
    command:
    - XPolicyLab/policy/Pi_05/openpi/.venv/bin/python
    - -m
    - manimux.servers.pi05
    - --experiment
    - '{config}'
    - --local
    - '{local}'
    env:
      PYTHONPATH: null
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    startup_timeout_s: 600
    stop_timeout_s: 30
