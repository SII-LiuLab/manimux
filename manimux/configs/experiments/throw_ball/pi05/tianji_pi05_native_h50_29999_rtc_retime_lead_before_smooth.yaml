# Throw-ball task; runtime parameters match the prior retimed Pi05 deployment.
local: ../../../../../.local/pack_plate/pi05_checkpoint_comparison_20261019/station.yaml
run:
  task: pick up the balls from the table and toss them into the white box using both
    grippers
  output_dir: ./data/experiments/throw-ball-pi05-native-h50-29999/rtc-retime-18-lead-before-smooth
  experiment_name: throw-ball-pi05-native-h50-29999
  condition: rtc-retime-18-15hz-lead-before-smooth
  max_control_steps: 40000
  warmup_before_start: true
  task_label: Throw ball
robot:
  type: tianji_taccap
  config: ../../pack_plate/pi05/checkpoint_comparison_20261028/robot.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 8
    right_arm: 8
  group_layouts:
    left_arm:
      arm_dofs: 7
      gripper_dofs: 1
    right_arm:
      arm_dofs: 7
      gripper_dofs: 1
  options:
    execute: true
    end_effector_control: true
    hardware:
      stale_timeout_s: 0.1
    component_hardware:
      left_end_effector:
        read_hz: 100.0
        control_mode: impedance
      right_end_effector:
        read_hz: 100.0
        control_mode: impedance
sensors:
- name: tianji_wrist_cameras
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names:
    - taccap_left
    - taccap_right
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      taccap_left: left_wrist_camera
      taccap_right: right_wrist_camera
policy:
  config: ../../pack_plate/pi05/checkpoint_comparison_20261028/policy-runtime.yaml
  horizon_policy_steps: 50
  playback_hz: 15.0
robogui:
  enabled: true
  robot: tianji-taccap
  policy_label: Pi05 / Throw Ball Native H50 / 29999 / RTC Adaptive Speed 18 / 15 Hz / DiffIK Lead then Smooth
recording:
  config: ../../pack_plate/pi05/checkpoint_comparison_20261028/recording.yaml
  enabled: true
inference:
  config: ../../pack_plate/pi05/checkpoint_comparison_20261028/rtc16.yaml
  strategy: manimux.runtime.rtc.retimed:RetimedRtcStrategy
  chunk_policy_steps: 18
  handoff_skip_steps: 0
  blend_policy_steps: 0
  rtc:
    condition_source: timeline
    min_execute_policy_steps: 18
    initial_delay_policy_steps: 4
  rtc_retime:
    strength: 0.5
    rotation_radius_m: 0.1
    stationary_distance_m: 0.0002
    gripper_event_delta: 0.08
    gripper_motion_delta: 0.005
    min_interval_ratio: 0.35
    match_window_s: 0.6
    match_resolution_steps: 0.25
    max_position_gap_m: 0.025
    max_rotation_gap_rad: 0.3
    max_gripper_gap: 0.15
    min_direction_cosine: 0.0
    bridge_s: 0.2
    min_future_s: 0.6
    runtime_substeps: 8
executor:
  tianji_position_lead:
    placement: before_smooth
    lead_ms: 60
    ka_s2: 0
    accel_cap_deg: 0.5
    max_offset_deg: 10
  config: ../../pack_plate/pi05/checkpoint_comparison_20261028/executor.yaml
  smooth:
    gripper:
      mode: continuous
policy_server:
  checkpoint_low_memory: true
  config: ../../../policy/pi05/tianji/throw_ball/native-h50-step29999.yaml
camera_server:
  config: ../../../embodiment/sensor/cameras/taccap_2_views.yaml
