run:
  task: Pick the red block up.
  output_dir: ./data
  max_steps: 1600

robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    move_to_start_on_connect: true
    start_duration_s: 3.5
    home_duration_s: 3.5
    home_on_close: true
    start_joints:
      left_arm:
      - -0.6094071869993112
      - 0.5834668497749291
      - 0.8424887464713517
      - -1.0168230716411042
      - -0.11081864652475382
      - -0.45796139467459973
      - 0.9969282527609157
      right_arm:
      - 0.321393148699169
      - 0.5643930724040587
      - 0.8009079118028541
      - -1.01796749828336
      - -0.18024719615472584
      - 0.4129472800793472
      - 0.994773647405226
    execute: true
    component_hardware:
      left_yam:
        channel: can_left
      right_yam:
        channel: can_right
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  options:
    endpoint: tcp://127.0.0.1:5555
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xpolicylab_ws
  adapter:
  # Explicit time-stretch comparison. This is not the Pi05-YAM default: the
  # checkpoint-native interval is 1/30 s, while this experiment uses 0.05 s.
    type: manimux.policy_adapter.joint:JointAdapter
    group_order: [left_arm, right_arm]
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      cam_head: front_camera
      cam_left_wrist: left_camera
      cam_right_wrist: right_camera

  action_dt_s: 0.05
  timeout_s: 2.0
  horizon_steps: 16
  inference_delay_s: 0.0
  startup_timeout_s: 30.0
  options:
    server: ws://127.0.0.1:8500
    request_timeout_s: 10.0
viewer:
  enabled: true
  robot: yam
  policy_label: pi05 YAM finetune stretched 50ms

recording:
  enabled: true
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
inference:
  algorithm: manimux
  inference_schedule: single_inflight
  refill_threshold_s: 0.2
  commit_lead_s: 0.0
  max_plan_age_s: 2.0
  blend_steps: 4
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    # 2026-08-20 首次 rollout 的 0.20/0.40 会让 30Hz 模型轨迹持续落后并抖动。
    # 这里恢复 ManiMux 默认跟踪包络；它不是对模型 action 的主观通过/拒绝阈值。
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14
