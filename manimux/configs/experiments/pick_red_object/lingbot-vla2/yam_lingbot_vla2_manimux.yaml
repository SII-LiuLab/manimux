run:
  task: Pick up the red ball.
  output_dir: ./data
  max_control_steps: 1600

robot:
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 30.0
  options:
    move_to_start_on_connect: true
    start_duration_s: 3.5
    home_duration_s: 3.5
    home_on_close: true
    start_joints:
      left_arm:
      - -0.6094071869993112
      - 0.5834668497749291
      - 0.8424887464713517
      - -1.0168230716411042
      - -0.11081864652475382
      - -0.45796139467459973
      - 0.9969282527609157
      right_arm:
      - 0.321393148699169
      - 0.5643930724040587
      - 0.8009079118028541
      - -1.01796749828336
      - -0.18024719615472584
      - 0.4129472800793472
      - 0.994773647405226
    execute: true
  type: yam

sensors:
- name: yam_cameras
  driver: camera_server
  service: camera
  options:
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xpolicylab_ws
  service: policy_secondary
  adapter:
  # Must be changed to the native frequency of the eventual YAM post-training
  # data. The public foundation checkpoint does not define a YAM control rate.
    type: manimux.policy_adapter.joint:JointAdapter
    camera_map:
      cam_head: front_camera
      cam_left_wrist: left_camera
      cam_right_wrist: right_camera
    action_codec: joint_position
  action_dt_s: 0.03333333333333333
  timeout_s: 2.0
  horizon_policy_steps: 50
  inference_delay_s: 0.0
  startup_timeout_s: 120.0
  options:
    action_format: joint
    request_timeout_s: 20.0

viewer:
  enabled: true
  robot: yam
  policy_label: LingBot-VLA2 YAM via XPolicyLab

recording:
  enabled: true

# Inference controls requests and chunk handoff; the executor controls smoothing and limits.
inference:
  algorithm: manimux
  config: ../../../inference/yam_manimux_single.yaml
  refill_threshold_s: 0.4
  max_plan_age_s: 2.0
  blend_policy_steps: 8

executor:
  type: smooth
  config: ../../../executor/yam_smooth_arm_standard.yaml

# Device serials and service addresses come from the shared station file.
camera_server:
  config: ../../../embodiment/sensor/cameras/realsense_3_views.yaml
