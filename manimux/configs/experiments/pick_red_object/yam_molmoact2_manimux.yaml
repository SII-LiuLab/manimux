  # 一次 rollout 最多执行的控制步数；达到后自动回 Home 并退出。
  # 100 Hz 下保持约 53 秒的 rollout 时长。
  # 保留模型 20 Hz 的轨迹语义；Timeline 在 100 Hz 控制环中插值执行。
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
    # 这些限制按秒定义，不随控制频率改变。
    # Policy 执行时的关节最大加速度（rad/s^2）。
run:
  task: Pick the red ball up and place it into the box.
  output_dir: ./data
  max_steps: 5333
robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    move_to_start_on_connect: true
    start_duration_s: 3.0
    home_duration_s: 3.0
    home_on_close: true
    start_joints:
      left_arm:
      - -0.6094071869993112
      - 0.5834668497749291
      - 0.8424887464713517
      - -1.0168230716411042
      - -0.11081864652475382
      - -0.45796139467459973
      - 0.9969282527609157
      right_arm:
      - 0.321393148699169
      - 0.5643930724040587
      - 0.8009079118028541
      - -1.01796749828336
      - -0.18024719615472584
      - 0.4129472800793472
      - 0.994773647405226
    execute: true
    component_hardware:
      left_yam:
        channel: can_left
      right_yam:
        channel: can_right
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  options:
    endpoint: tcp://127.0.0.1:5555
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names:
    - left_camera
    - front_camera
    - right_camera
policy:
  worker: molmoact_http
  adapter:
    type: manimux.policy_adapter.molmoact_yam:MolmoActYamAdapter
    group_order:
    - left_arm
    - right_arm
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
  action_dt_s: 0.05
  timeout_s: 1.0
  horizon_steps: 30
  inference_delay_s: 0.0
  options:
    server: http://127.0.0.1:8202
    enable_cuda_graph: true
    normalization_tag: yam_dual_molmoact2
viewer:
  enabled: true
  robot: yam
  policy_label: MolmoAct2
recording:
  enabled: true
inference:
  algorithm: manimux
  inference_schedule: single_inflight
  refill_threshold_s: 0.4
  commit_lead_s: 0.0
  max_plan_age_s: 1.0
  blend_steps: 8
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14
