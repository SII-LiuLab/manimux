  # 一次 rollout 最多执行的控制步数；达到后自动回 Home 并退出。
  # 老师原 ManiMux 的时间定义：相邻两个 Policy 点间隔 0.05 秒。
    # RTC 的 VJP 引导让推理慢 2.2 倍（10 步采样时 613ms）。降到 5 步压回
    # 7 步延迟，可行窗口 d<=s<=H-d 才有余量。
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
    # 配 5 步采样：(t²+(1−t)²)/(t(1−t)) 在 t=1/5 处 ≈ 4.25
    # 运动整形（低通/速度/加速度/位置限制）复用下面的 execution.smooth，
    # 和默认 runtime 完全同一套参数，只是折进 chunk 而不是放在下游。
    # Policy 执行时的关节最高速度（rad/s）。
    # Policy 执行时的关节最大加速度（rad/s^2）。
run:
  task: Pick the red ball up and place it into the box.
  output_dir: ./data
  max_steps: 1600
robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 20.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    move_to_start_on_connect: true
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: true
    start_joints:
      left_arm:
      - -0.6094071869993112
      - 0.5834668497749291
      - 0.8424887464713517
      - -1.0168230716411042
      - -0.11081864652475382
      - -0.45796139467459973
      - 0.9969282527609157
      right_arm:
      - 0.321393148699169
      - 0.5643930724040587
      - 0.8009079118028541
      - -1.01796749828336
      - -0.18024719615472584
      - 0.4129472800793472
      - 0.994773647405226
    execute: true
    component_hardware:
      left_yam:
        channel: can_left
      right_yam:
        channel: can_right
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  options:
    endpoint: tcp://127.0.0.1:5555
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names:
    - left_camera
    - front_camera
    - right_camera
policy:
  worker: molmoact_http
  adapter:
    type: manimux.policy_adapter.molmoact_yam:MolmoActYamAdapter
    group_order:
    - left_arm
    - right_arm
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
  action_dt_s: 0.05
  timeout_s: 1.0
  horizon_steps: 30
  inference_delay_s: 0.0
  options:
    server: http://127.0.0.1:8202
    enable_cuda_graph: true
    num_steps: 5
    normalization_tag: yam_dual_molmoact2
viewer:
  enabled: true
  robot: yam
  policy_label: MolmoAct
recording:
  enabled: true
inference:
  algorithm: rtc
  rtc:
    min_execute_steps: 15
    initial_delay_steps: 8
    delay_buffer_size: 10
    beta: 4.25
  commit_lead_s: 0.0
  max_plan_age_s: 1.0
  blend_steps: 8
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14
  mpc:
    horizon_steps: 15
    dynamics_a: 0.85
    tracking_weight: 10.0
    command_delta_weight: 1.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14
