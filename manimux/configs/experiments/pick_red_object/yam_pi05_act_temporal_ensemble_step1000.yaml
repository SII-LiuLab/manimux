run:
  task: Pick the red ball up and place it into the box.
  output_dir: ./data/experiments/pi05-red-ball-box-step1000/act
  max_steps: 6000

robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    move_to_start_on_connect: true
    start_duration_s: 3.0
    home_duration_s: 3.0
    home_on_close: true
    start_joints:
      left_arm:
      - -0.6094071869993112
      - 0.5834668497749291
      - 0.8424887464713517
      - -1.0168230716411042
      - -0.11081864652475382
      - -0.45796139467459973
      - 0.9969282527609157
      right_arm:
      - 0.321393148699169
      - 0.5643930724040587
      - 0.8009079118028541
      - -1.01796749828336
      - -0.18024719615472584
      - 0.4129472800793472
      - 0.994773647405226
    execute: true
    component_hardware:
      left_yam:
        channel: can_left
      right_yam:
        channel: can_right
  type: yam
sensors:
- name: yam_cameras
  driver: camera_server
  options:
    endpoint: tcp://127.0.0.1:5555
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xpolicylab_ws
  adapter:
    type: manimux.policy_adapter.joint:JointAdapter
    group_order: [left_arm, right_arm]
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      cam_head: front_camera
      cam_left_wrist: left_camera
      cam_right_wrist: right_camera

  action_dt_s: 0.03333333333333333
  timeout_s: 2.0
  horizon_steps: 50
  inference_delay_s: 0.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_family: pi05
      task_name: pick_the_red_ball_up_and_place_it_into_the_box
      checkpoint_variant: pi05_yam_pick_red_ball_box_step_1000
      checkpoint_source: local_pi05_base_finetune_step_1000
      norm_stats_source: checkpoint_matched_yam_pick_red_ball_box_v1
      train_config_name: pi05_yam
      model_root:
        finetuned/ziyang/pi05-yam-pick-red-ball-box-b384/1000
      norm_stats_path:
        finetuned/ziyang/pi05-yam-pick-red-ball-box-b384/1000/assets/yam_pick_red_ball_box_v1
      action_horizon: 50
      num_steps: 10
  startup_timeout_s: 30.0
  options:
    server: ws://127.0.0.1:8500
    request_timeout_s: 10.0
viewer:
  enabled: true
  robot: yam
  policy_label: Pi05 YAM red-ball step-1000 ACT temporal ensemble

recording:
  enabled: true
  video_fps: 30.0
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
inference:
  algorithm: act_temporal_ensemble
  commit_lead_s: 0.0
  max_plan_age_s: 2.0
  blend_steps: 0
  temporal_ensemble:
    coefficient: 0.01
    query_interval_steps: 4
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14

policy_server:
  config: ../../policy/pi05/yam/finetune-pick-red-ball-box-step1000.yaml
