# Example study entry: the same Dream-1 model driven by the RPent agent. execute=false
# here: enable it for your station in a private variant after the offline and Finish checks.
_base_:
- ../_base_.yaml
- ../../../tasks/put_bottles.yaml
agent:
  config: ../../../agents/rpent_dream1_yam.yaml
run:
  task_prompt: Put the bottles into the bin.
robot:
  options:
    execute: false
robogui:
  policy_label: Dream-1 beta - RPent - Serial 30 Hz
inference:
  # RPent sets rows per call (execute_policy.use_length); a configured chunk cap is rejected.
  chunk_policy_steps: null
  max_chunk_policy_steps: null
  # The arms hold while a call waits; an expired Dream session costs one extra round trip.
  max_plan_age_s: 10.0
policy:
  timeout_s: 10.0
experiment:
  task: put_bottles
  variant: rpent
