# X5 joint contract template. Bind a matching checkpoint and endpoint before rollout.
run:
  task: configure a RoboDojo task
  output_dir: ./data/asyncsim-policy
  max_control_steps: 500

robot:
  type: asyncsim
  control_hz: 50
  group_dims: {left_arm: 7, right_arm: 7}
  options:
    endpoint: ws://127.0.0.1:18765
    state_stream: proprio.canonical_joint_state
    state_keys: {left_arm: left_arm, right_arm: right_arm}
    command_ttl_s: 0.2

sensors:
- name: asyncsim_cameras
  driver: asyncsim
  options:
    streams:
      head: camera.cam_head.rgb
      left_wrist: camera.cam_left_wrist.rgb
      right_wrist: camera.cam_right_wrist.rgb

policy:
  worker: xpolicylab_ws
  options:
    server: ws://127.0.0.1:18766
    action_format: joint
  expected_backend:
    server: xpolicylab_policy_server
  adapter:
    type: manimux.policy_adapter.joint:JointAdapter
    group_layouts:
      left_arm: {arm_dofs: 6, gripper_dofs: 1}
      right_arm: {arm_dofs: 6, gripper_dofs: 1}
    camera_map: {head: head, left_wrist: left_wrist, right_wrist: right_wrist}
  action_dt_s: 0.02
  horizon_policy_steps: 4

inference:
  algorithm: manimux
  action_start_mode: first_step_when_ready
  commit_lead_s: 0.0
  blend_policy_steps: 0

executor:
  type: direct
