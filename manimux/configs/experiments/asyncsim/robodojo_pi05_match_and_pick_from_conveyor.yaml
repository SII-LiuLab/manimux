run:
  task: match_and_pick_from_conveyor
  instruction_stream: language.instruction
  output_dir: ./data/asyncsim-pi05-match-and-pick-from-conveyor
  max_control_steps: 700
  max_command_submissions: 1400
  skip_unplanned_commands: true
  simulation_time_timeline: true

robot:
  type: asyncsim
  control_hz: 250
  group_dims: {left_arm: 7, right_arm: 7}
  options:
    endpoint: ws://127.0.0.1:18765
    state_stream: proprio.canonical_joint_state
    state_keys: {left_arm: left_arm, right_arm: right_arm}
    command_ttl_s: 35.0

sensors:
- name: robodojo_cameras
  driver: asyncsim
  options:
    streams:
      head: camera.cam_head.rgb
      left_wrist: camera.cam_left_wrist.rgb
      right_wrist: camera.cam_right_wrist.rgb

policy:
  worker: xpolicylab_ws
  options:
    server: ws://127.0.0.1:18766
    action_format: joint
    request_timeout_s: 30.0
  adapter:
    type: manimux.policy_adapter.robodojo_joint:RoboDojoJointAdapter
    group_layouts:
      left_arm: {arm_dofs: 6, gripper_dofs: 1}
      right_arm: {arm_dofs: 6, gripper_dofs: 1}
    camera_map: {cam_head: head, cam_left_wrist: left_wrist, cam_right_wrist: right_wrist}
  action_dt_s: 0.004
  horizon_policy_steps: 50
  timeout_s: 30.0
  startup_timeout_s: 1200.0

inference:
  algorithm: manimux
  inference_schedule: single_inflight
  refill_threshold_s: 0.08
  action_start_mode: skip_elapsed_steps
  commit_lead_s: 0.0
  max_plan_age_s: 30.0
  blend_policy_steps: 0
  max_chunk_policy_steps: 50

executor:
  type: direct

policy_server:
  config: ../../policy/pi05/robodojo/sim_arx_x5_joint_59999.yaml
  task_name: match_and_pick_from_conveyor
