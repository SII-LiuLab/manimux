# Offline contract example; state keys and group widths are synthetic.
run:
  task: fake AsyncSim joint policy
  output_dir: ./data/asyncsim-fake
  max_control_steps: 20

robot:
  type: asyncsim
  control_hz: 50
  group_dims: {left_arm: 2, right_arm: 2}
  options:
    endpoint: ws://127.0.0.1:18765
    state_stream: proprio.joint_state
    state_keys: {left_arm: left_joints, right_arm: right_joints}
    command_ttl_s: 0.2

sensors:
- name: asyncsim_cameras
  driver: asyncsim
  options:
    streams: {head: camera.head.rgb}

policy:
  worker: mock
  adapter:
    type: manimux.policy_adapter.joint:JointAdapter
    group_layouts:
      left_arm: {arm_dofs: 1, gripper_dofs: 1}
      right_arm: {arm_dofs: 1, gripper_dofs: 1}
    camera_map: {head: head}
  action_dt_s: 0.02
  horizon_policy_steps: 4

inference:
  algorithm: manimux
  action_start_mode: first_step_when_ready
  commit_lead_s: 0.0
  blend_policy_steps: 0

executor:
  type: direct
