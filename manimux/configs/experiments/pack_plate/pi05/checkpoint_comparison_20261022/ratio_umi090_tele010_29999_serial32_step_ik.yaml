# Per-tick DiffIK counterpart; checkpoint, station and schedule match the chunk experiment.
local: ../../../../../../.local/pack_plate/pi05_checkpoint_comparison_20261019/station.yaml
run:
  task: place each plate into a bubble wrap sleeve
  output_dir: ./data/experiments/pi05-pack-plate-checkpoint-comparison-20261022/ratio_umi090_tele010_29999/serial32_step_ik
  experiment_name: pi05-pack-plate-checkpoint-comparison-20261022
  condition: ratio_umi090_tele010_29999-serial32-step-ik
  max_control_steps: 6000
  warmup_before_start: true
  task_label: Pack plate
robot:
  type: tianji_taccap
  config: robot.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 8
    right_arm: 8
  group_layouts:
    left_arm:
      arm_dofs: 7
      gripper_dofs: 1
    right_arm:
      arm_dofs: 7
      gripper_dofs: 1
  options:
    execute: true
    end_effector_control: true
    hardware:
      stale_timeout_s: 0.1
    component_hardware:
      left_end_effector:
        read_hz: 100.0
        control_mode: force_position
        grasp_torque_nm: 1.0
        close_speed_radps: 3.0
      right_end_effector:
        read_hz: 100.0
        control_mode: force_position
        grasp_torque_nm: 1.0
        close_speed_radps: 3.0
sensors:
- name: tianji_wrist_cameras
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names:
    - taccap_left
    - taccap_right
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      taccap_left: left_wrist_camera
      taccap_right: right_wrist_camera
policy:
  config: policy-runtime-step.yaml
robogui:
  enabled: true
  robot: tianji-taccap
  policy_label: Pi05 / UMI 090 + Teleop 010 / 29999 / Serial 32 / Step DiffIK
recording:
  enabled: true
inference:
  decode_forecast_size: 0
  expected_decode_s: 0.0  # Inline pose decoding has no process-decode forecast.
  config: serial32.yaml
executor:
  config: executor.yaml
  type: direct
  motion_limits:
    arm:
      max_acceleration: 160.0  # Outer guard; the step QP enforces 80 rad/s^2.
policy_server:
  checkpoint_low_memory: true
  config: ../../../../policy/pi05/tianji/pack_plate/ratio-umi090-tele010-step29999.yaml
camera_server:
  config: ../../../../embodiment/sensor/cameras/taccap_2_views.yaml
execution:
  ik:
    mode: step
    backend: diff
    budget_ms: 5.0
    pose_speed_limit: null
    diff_ik:
      max_velocity_rad_s: 1.5707963267948966
      max_acceleration_rad_s2: 80.0
      elbow_guard_deg: 1.0
      w_pos: 1.0
      w_rot: 1.0
      lam: 0.001
      limit_margin_deg: null
      j67_margin_deg: null
      mu_nullspace: 1000.0
      nullspace_activation_deg: 25.0
      nullspace_weights: null
      max_lag_mm: 5.0
      max_lag_deg: null
      lag_policy: report
