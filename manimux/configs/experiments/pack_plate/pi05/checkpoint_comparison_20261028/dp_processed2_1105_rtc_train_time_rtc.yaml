local: ../../../../../../.local/pack_plate/pi05_checkpoint_comparison_20261019/station.yaml
run:
  task: place each plate into a bubble wrap sleeve
  output_dir: ./data/experiments/pack-plate-20261028/dp_processed2_1105_rtc_train_time_rtc
  experiment_name: pack-plate-20261028
  condition: dp_processed2_1105_rtc_train_time_rtc
  max_control_steps: 6000
  warmup_before_start: true
  task_label: Pack plate
robot:
  type: tianji_taccap
  config: robot.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 8
    right_arm: 8
  group_layouts:
    left_arm:
      arm_dofs: 7
      gripper_dofs: 1
    right_arm:
      arm_dofs: 7
      gripper_dofs: 1
  options:
    execute: true
    end_effector_control: true
    hardware:
      stale_timeout_s: 0.1
    component_hardware:
      left_end_effector:
        read_hz: 100.0
        control_mode: force_position
        grasp_torque_nm: 1.0
        close_speed_radps: 3.0
      right_end_effector:
        read_hz: 100.0
        control_mode: force_position
        grasp_torque_nm: 1.0
        close_speed_radps: 3.0
sensors:
- name: tianji_wrist_cameras
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names:
    - taccap_left
    - taccap_right
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      taccap_left: left_wrist_camera
      taccap_right: right_wrist_camera
policy:
  worker: xpolicylab_ws
  service: policy
  adapter:
    type: manimux.policy_adapter.umi_dp.train_time_rtc:TrainTimeRtcUmiDpTianjiAdapter
    camera_map:
      cam_left_wrist: left_wrist_camera
      cam_right_wrist: right_wrist_camera
      cam_left_wrist_prev: left_wrist_camera_prev
      cam_right_wrist_prev: right_wrist_camera_prev
    gripper_clip_tolerance: 0.1
    ik_validation_dt_s: 0.004
    ik_backend: diff
    execute_diff_ik_substeps: true
    handoff_waypoint:
      max_pos_speed_m_s: 0.4
      max_rot_speed_rad_s: 1.2
    diff_ik:
      max_velocity_rad_s: 1.5707963267948966
      w_pos: 1.0
      w_rot: 1.0
      lam: 0.001
      limit_margin_deg: null
      j67_margin_deg: null
      mu_nullspace: 1000.0
      nullspace_activation_deg: 25.0
      nullspace_weights: null
      max_lag_mm: 5.0
      max_lag_deg: null
      lag_policy: report
  action_decoding: process
  action_dt_s: 0.03333333333333333
  horizon_policy_steps: 32
  timeout_s: 120.0
  startup_timeout_s: 180.0
  options:
    connect_timeout_s: 60.0
    request_timeout_s: 120.0
robogui:
  enabled: true
  robot: tianji-taccap
  policy_label: UMI DP / Processed2 1105 / RTC Finetune 60000 / Train-time RTC
recording:
  config: recording.yaml
  enabled: true
inference:
  algorithm: train_time_rtc
  strategy: manimux.policy_adapter.umi_dp.train_time_rtc:build_strategy
  chunk_policy_steps: 16
  blend_policy_steps: 0
  handoff_skip_steps: 0
  action_start_mode: drop_infer_latency
  expected_decode_s: 0.04
  decode_forecast_size: 10
  decode_forecast_mode: max
  max_plan_age_s: 2.0
  train_time_rtc:
    delay_estimator: fixed
    fixed_prefix_steps: 5
  history:
    period_tolerance_s: 0.04
    state_tolerance_s: 0.02
    camera_skew_s: 0.04
executor:
  config: executor.yaml
policy_server:
  config: dp_processed2_1105_rtc_server.yaml
camera_server:
  config: ../../../../embodiment/sensor/cameras/taccap_2_views.yaml
