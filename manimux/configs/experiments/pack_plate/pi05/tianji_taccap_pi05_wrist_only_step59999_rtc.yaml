# RTC variant of the pack-plate Pi05 experiment; hardware execution stays disabled.
control_profile: ../../../embodiment/robot/tianji_control.yaml

run:
  task: plate
  output_dir: ./data/experiments/pi05-tianji-pack-plate-wrist-only-step59999-rtc
  max_control_steps: 2400

robot:
  type: tianji_taccap
  config: ../../../embodiment/robot/tianji_taccap_pack_plate.yaml
  control_hz: 100.0
  options:
    execute: false
    end_effector_control: false
    hardware:
      stale_timeout_s: 0.1
    component_hardware:
      left_end_effector:
        read_hz: 100.0
        control_mode: force_position
        grasp_torque_nm: 1.0
        close_speed_radps: 1.1
      right_end_effector:
        read_hz: 100.0
        control_mode: force_position
        grasp_torque_nm: 1.0
        close_speed_radps: 1.1

sensors:
- name: tianji_wrist_cameras
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names: [taccap_left, taccap_right]
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      taccap_left: left_wrist_camera
      taccap_right: right_wrist_camera

policy:
  worker: xpolicylab_ws
  # The station's policy service binds both this client and the paired server.
  service: policy
  adapter:
    type: manimux.policy_adapter.pi05.tianji:Pi05PackPlateTacCapAdapter
    camera_map:
      cam_left_wrist: left_wrist_camera
      cam_right_wrist: right_wrist_camera
    gripper_clip_tolerance: 0.1
    ik_validation_dt_s: 0.004
    ik_backend: diff
    diff_ik:
      config: ../../../embodiment/arm/tianji_diff_ik.yaml
  action_decoding: process
  action_dt_s: 0.03333333333333333
  horizon_policy_steps: 32
  timeout_s: 120.0
  startup_timeout_s: 180.0
  options:
    connect_timeout_s: 60.0
    request_timeout_s: 120.0
    server: ws://127.0.0.1:8571

robogui:
  enabled: true
  robot: tianji-taccap
  policy_label: Pi05 / Tianji-TacCap / pack plate / wrist only / step59999 / RTC

recording:
  enabled: true

inference:
  algorithm: rtc
  max_plan_age_s: 2.0
  blend_policy_steps: 2
  handoff: blend
  handoff_margin_s: 0.01
  expected_decode_s: 0.08
  decode_forecast_size: 10
  decode_forecast_mode: max
  independent_group_decoding: false
  rtc:
    min_execute_policy_steps: 24
    initial_delay_policy_steps: 8
    delay_buffer_size: 10
    beta: 5.0

executor:
  type: smooth
  config: ../../../executor/tianji_smooth_control_profile.yaml
  smooth:
    gripper:
      mode: curve
      deadzone: 0.05
      exponent: 1.1

policy_server:
  config: ../../../policy/pi05/tianji/pack_plate/wrist-only-step59999.yaml

# Device serials and service addresses come from the shared station file.
camera_server:
  config: ../../../embodiment/sensor/cameras/taccap_2_views.yaml
