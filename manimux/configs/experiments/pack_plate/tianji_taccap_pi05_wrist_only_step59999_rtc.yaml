# RTC variant of the pack-plate Pi05 experiment; hardware execution stays disabled.
run:
  task: plate
  output_dir: ./data/experiments/pi05-tianji-pack-plate-wrist-only-step59999-rtc
  max_steps: 2400
robot:
  type: tianji_taccap
  config: ../../embodiment/robot/tianji_taccap.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 8
    right_arm: 8
  options:
    execute: false
    end_effector_control: false
    hardware:
      stale_timeout_s: 0.1
    component_hardware:
      left_end_effector:
        read_hz: 100.0
      right_end_effector:
        read_hz: 100.0
sensors:
- name: tianji_wrist_cameras
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names:
    - left_wrist
    - right_wrist
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      left_wrist: left_wrist_camera
      right_wrist: right_wrist_camera
policy:
  worker: xpolicylab_ws
  adapter:
    type: manimux.policy_adapter.pi05.tianji:Pi05PackPlateTacCapAdapter
    group_order:
    - left_arm
    - right_arm
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      cam_left_wrist: left_wrist_camera
      cam_right_wrist: right_wrist_camera
    gripper_clip_tolerance: 0.1
    gripper_output_deadzone: 0.05
    gripper_output_exponent: 1.1
    ik_validation_dt_s: 0.004
    ik_backend: diff
    diff_ik:
      max_velocity_rad_s: 0.9047786842338605
      dt_max_s: 0.016
      w_pos: 1.0
      w_rot: 1.0
      lam: 0.001
      check_j67: true
      mu_nullspace: 1000.0
      nullspace_activation_deg: 25.0
      limit_margin_deg: null
      j67_margin_deg: null
      max_lag_mm: 5.0
      max_lag_deg: null
      lag_policy: report
  action_decoding: process
  action_dt_s: 0.03333333333333333
  horizon_steps: 32
  timeout_s: 120.0
  startup_timeout_s: 180.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_name: Pi_05
      task_name: plate
      checkpoint_variant: pi05_pack_plate_wrist_only_step59999
      checkpoint_source: pi05-pack-plate-wrist-only-final-59999
      norm_stats_source: sha256_58756179164751e336c56fbf9735196cefd6dca0c9d62cd459ec6c6b7f091c21
      train_config_name: pi05_pack_plate_wrist_only_zero_pose_deploy
      observation_profile: tianji_taccap_pi05_pack_plate
      model_state_encoding: zero_pose
      action_horizon: 32
      num_steps: 10
      action_type: ee
      output_format: xpolicylab
      action_semantics: absolute_per_arm_base_xyz_wxyz
  options:
    connect_timeout_s: 60.0
    request_timeout_s: 120.0
    server: ws://127.0.0.1:8571
policy_server:
  config: ../../policy/pi05/tianji/pack_plate/wrist-only-step59999.yaml
camera_server:
  cameras:
    left_wrist:
      component: left_wrist_camera
      type: taccap
    right_wrist:
      component: right_wrist_camera
      type: taccap
inference:
  algorithm: rtc
  strategy: null
  max_plan_age_s: 2.0
  blend_steps: 2
  handoff: blend
  handoff_margin_s: 0.01
  commit_lead_s: 0.02
  expected_decode_s: 0.08
  decode_forecast_size: 10
  decode_forecast_mode: max
  independent_group_decoding: false
  rtc:
    min_execute_steps: 24
    initial_delay_steps: 8
    delay_buffer_size: 10
    beta: 5.0
executor:
  type: smooth
  config: ../../executor/tianji_taccap_smooth.yaml
  smooth:
    gripper:
      mode: continuous
viewer:
  enabled: true
  robot: tianji-taccap
  policy_label: Pi05 / Tianji-TacCap / pack plate / wrist only / step59999 / RTC
recording:
  enabled: true
