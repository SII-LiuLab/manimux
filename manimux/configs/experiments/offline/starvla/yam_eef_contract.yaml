# Offline synthetic plant only; no camera or robot hardware.
local: station_example.yaml
run:
  task: Follow the offline EEF reference.
  output_dir: ./data/experiments/starvla-offline/yam_eef_contract
  max_control_steps: 500
robot:
  type: scripts.validation.starvla_fixtures.robot:build_robot
  config: ../../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    offline_model: true
    initial_groups: &id001
      left_arm:
      - 0.15
      - 0.47
      - 0.8
      - -1.0
      - -0.33
      - 0.27
      - 0.5
      right_arm:
      - -0.2
      - 0.6
      - 0.75
      - -1.1
      - -0.25
      - 0.15
      - 0.65
sensors:
- name: cam_head
  driver: scripts.validation.starvla_fixtures.sensor:build_sensor
  width: 224
  height: 224
  fps: 30.0
- name: cam_left_wrist
  driver: scripts.validation.starvla_fixtures.sensor:build_sensor
  width: 224
  height: 224
  fps: 30.0
- name: cam_right_wrist
  driver: scripts.validation.starvla_fixtures.sensor:build_sensor
  width: 224
  height: 224
  fps: 30.0
policy:
  worker: starvla_ws
  service: policy
  action_decoding: process
  adapter:
    type: manimux.policy_adapter.pose:PoseAdapter
    action_semantics: absolute_per_arm_base_xyz_wxyz
    decode_policy_steps: 20
    parallel_ik: true
    ik_warmup_joints: *id001
    camera_map:
      cam_head: cam_head
      cam_left_wrist: cam_left_wrist
      cam_right_wrist: cam_right_wrist
  action_dt_s: 0.03333333333333333
  horizon_policy_steps: 50
  timeout_s: 10.0
  startup_timeout_s: 120.0
  options:
    action_format: pose
    request_timeout_s: 10.0
robogui:
  enabled: false
  robot: yam
recording:
  enabled: true
  video_fps: 20.0
inference:
  algorithm: manimux
  config: ../../../inference/yam_manimux_chunk20.yaml
  expected_decode_s: 0.05
executor:
  type: smooth
  config: ../../../executor/yam_smooth_standard.yaml
policy_server:
  config: ../../../policy/starvla/yam/absolute_eef/chunk.yaml
