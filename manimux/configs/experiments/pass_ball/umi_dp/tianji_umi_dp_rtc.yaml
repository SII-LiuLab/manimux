control_profile: ../../../embodiment/robot/tianji_control.yaml

run:
  task: pass the ball between the two grippers
  output_dir: ./data/experiments/umi-dp-tianji
  max_control_steps: 2400 # 24 s at control_hz

robot:
  config: ../../../embodiment/robot/tianji_taccap.yaml
  options:
    hardware:
      stale_timeout_s: 0.1
  control_hz: 100.0

sensors:
- name: tianji_wrist_history
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names: [left_wrist, right_wrist]
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02

policy:
  action_dt_s: 0.03333333333333333  # Model action spacing, independent of command frequency.
  worker: xpolicylab_ws
  service: policy
  adapter:
    type: manimux.policy_adapter.umi_dp.tianji:UmiDpTianjiAdapter
    camera_map:
      cam_left_wrist: left_wrist
      cam_right_wrist: right_wrist
      cam_left_wrist_prev: left_wrist_prev
      cam_right_wrist_prev: right_wrist_prev
    ik_backend: analytic
  action_decoding: process
  horizon_policy_steps: 16
  timeout_s: 30.0
  startup_timeout_s: 120.0
  options:
    connect_timeout_s: 30.0
    request_timeout_s: 30.0

viewer:
  enabled: false
  robot: tianji
  policy_label: UMI DP Tianji

recording:
  enabled: true

# Inference schedules requests and chunks; the executor handles smoothing and limits.
inference:
  algorithm: rtc
  config: ../../../inference/yam_rtc_base.yaml
  max_plan_age_s: 2.0
  blend_policy_steps: 2
  rtc:
    initial_delay_policy_steps: 4
    min_execute_policy_steps: null
    beta: 5.0
  history:
    period_tolerance_s: 0.04
    state_tolerance_s: 0.02
    camera_skew_s: 0.04
  strategy: manimux.policy_adapter.umi_dp.history:build_strategy

executor:
  type: smooth
  config: ../../../executor/tianji_smooth_control_profile.yaml

policy_server:
  config: ../../../policy/umi_dp/tianji/assembly.yaml
  task_name: pass_ball

# Device serials and service addresses come from the shared station file.
camera_server:
  config: ../../../embodiment/sensor/cameras/taccap_2_views.yaml
