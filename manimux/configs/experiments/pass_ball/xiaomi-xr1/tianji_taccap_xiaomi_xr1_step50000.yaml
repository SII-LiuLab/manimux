# Safe-by-default Tianji-TacCap deployment for the XR-1 pass-ball checkpoint.
control_profile: ../../../embodiment/robot/tianji_control.yaml

run:
  task: pass the ball between the two grippers
  output_dir: ./data/experiments/xiaomi-xr1-tianji-pass-ball-step50000
  max_control_steps: 2400

robot:
  type: tianji_taccap
  config: ../../../embodiment/robot/tianji_taccap.yaml
  control_hz: 100.0
  options:
    execute: false
    end_effector_control: false
    hardware:
      stale_timeout_s: 0.1

sensors:
- name: tianji_wrist_cameras
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names: [left_wrist, right_wrist]
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      left_wrist: left_wrist_camera
      right_wrist: right_wrist_camera

policy:
  worker: xpolicylab_ws
  service: policy
  adapter:
    type: manimux.policy_adapter.xr1.tianji:XR1TianjiTacCapAdapter
    camera_map:
      cam_left_wrist: left_wrist_camera
      cam_right_wrist: right_wrist_camera
    ik_validation_dt_s: 0.004
  action_decoding: inline
  action_dt_s: 0.03333333333333333
  horizon_policy_steps: 30
  timeout_s: 120.0
  startup_timeout_s: 180.0
  options:
    connect_timeout_s: 60.0
    request_timeout_s: 120.0

viewer:
  enabled: false
  robot: tianji-taccap
  policy_label: Xiaomi Robotics 1 / Tianji-TacCap / pass ball

recording:
  enabled: true

inference:
  algorithm: manimux
  config: ../../../inference/tianji_taccap_manimux.yaml

executor:
  type: smooth
  config: ../../../executor/tianji_smooth_control_profile.yaml
  smooth:
    gripper:
      mode: continuous

policy_server:
  config: ../../../policy/xiaomi-xr1/tianji/pass_ball/step50000.yaml

# Device serials and service addresses come from the shared station file.
camera_server:
  config: ../../../embodiment/sensor/cameras/taccap_2_views.yaml
