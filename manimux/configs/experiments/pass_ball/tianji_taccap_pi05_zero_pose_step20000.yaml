    diff_ik:
      max_velocity_rad_s: 0.9047786842338605
      dt_max_s: 0.016
      w_pos: 1.0
      w_rot: 1.0
      lam: 0.001
      check_j67: true
      mu_nullspace: 1000.0
      nullspace_activation_deg: 25.0
      limit_margin_deg: null
      j67_margin_deg: null
      max_lag_mm: 5.0
      max_lag_deg: null
      lag_policy: report
  action_decoding: process
  action_dt_s: 0.03333333333333333
  horizon_steps: 32
  timeout_s: 120.0
  startup_timeout_s: 180.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_name: Pi_05
      task_name: pass_ball
      checkpoint_variant: pi05_pass_ball_zero_pose_step20000
      checkpoint_source: pi05-passball-zero-pose-h32-b16-60k-20260923-192017
      norm_stats_source: sha256_366317fc1523d326ca1b5eb73e05edecbd35c18f04804f1a842c281fed6e0d74
      train_config_name: pi05_pass_ball_hifi_umi_lora_zero_pose
      observation_profile: tianji_taccap_pi05_zero_pose
      model_state_encoding: zero_pose
      action_horizon: 32
      num_steps: 10
      action_type: ee
      output_format: xpolicylab
      action_semantics: absolute_per_arm_base_xyz_wxyz
  options:
    connect_timeout_s: 60.0
    request_timeout_s: 120.0
    server: ws://127.0.0.1:8570
