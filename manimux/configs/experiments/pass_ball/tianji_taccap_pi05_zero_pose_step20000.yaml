run:
  task: pass_ball
  output_dir: ./data/experiments/pi05-tianji-pass-ball-zero-pose-step20000
  max_steps: 2400
robot:
  type: tianji_taccap
  config: ../../embodiment/robot/tianji_taccap_pass_ball.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 8
    right_arm: 8
