# 实验入口：选择本体、policy 与运行方式。用 --local 指定工位，不自动连接设备。
run:
  task: pass the ball between the two grippers
  output_dir: ./data/experiments/umi-dp-tianji
  max_steps: 2400
robot:
  type: tianji_taccap
  config: ../../embodiment/robot/tianji_taccap.yaml
  control_hz: 100.0
  group_dims:
    left_arm: 8
    right_arm: 8
  options:
    execute: false
    end_effector_control: false
    hardware:
      stale_timeout_s: 0.1  # 保留原传球实验的反馈超时；本体默认仍为 0.2 s。
sensors:
- name: tianji_wrist_history
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  options:
    camera_names:
    - left_wrist
    - right_wrist
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      left_wrist: left_wrist_camera
      right_wrist: right_wrist_camera
  service: camera
viewer:
  enabled: false
  robot: tianji-taccap
  policy_label: UMI DP Tianji
recording:
  enabled: true
policy:
# UMI_DP 的 Tianji–TacCap 观察/动作约定。服务地址来自 local。
  worker: xpolicylab_ws
  action_decoding: process
  adapter:
    type: manimux.policy_adapter.umi_dp.tianji:UmiDpTianjiAdapter
    deployment_bound: false
    group_order:
    - left_arm
    - right_arm
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      cam_left_wrist: left_wrist_camera
      cam_right_wrist: right_wrist_camera
      cam_left_wrist_prev: left_wrist_camera_prev
      cam_right_wrist_prev: right_wrist_camera_prev
    observation_period_s: 0.1
    observation_tolerance_s: 0.04
    first_action_offset_s: 0.03333333333333333
    state_tolerance_s: 0.02
    camera_skew_s: 0.04
    ik_validation_dt_s: 0.004
    ik_backend: analytic
  horizon_steps: 16
  timeout_s: 30.0
  startup_timeout_s: 120.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_family: umi_dp
      observation_profile: tianji_umi_relative2
      action_semantics: absolute_per_arm_base_xyz_wxyz
  options:
    connect_timeout_s: 30.0
    request_timeout_s: 30.0
  action_dt_s: 0.03333333333333333
policy_server:
  config: ../../policy/umi_dp/tianji/assembly.yaml
  task_name: pass_ball
camera_server:
  cameras:
    left_wrist:
      component: left_wrist_camera
      type: taccap
    right_wrist:
      component: right_wrist_camera
      type: taccap
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
inference:
  algorithm: manimux
  config: ../../inference/tianji_taccap_umi_dp.yaml
executor:
  type: smooth
  config: ../../executor/tianji_taccap_smooth.yaml
