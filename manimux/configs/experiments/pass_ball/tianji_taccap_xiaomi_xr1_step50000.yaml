# Safe-by-default Tianji-TacCap deployment for the XR-1 pass-ball checkpoint.
run:
  task: pass the ball between the two grippers
  output_dir: ./data/experiments/xiaomi-xr1-tianji-pass-ball-step50000
  max_steps: 2400
robot:
  type: tianji_taccap
  config: ../../embodiment/robot/tianji_taccap.yaml
  control_hz: 100.0
  group_dims: {left_arm: 8, right_arm: 8}
  options:
    execute: false
    end_effector_control: false
    hardware:
      stale_timeout_s: 0.1
sensors:
- name: tianji_wrist_cameras
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names: [left_wrist, right_wrist]
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
    output_names:
      left_wrist: left_wrist_camera
      right_wrist: right_wrist_camera
policy:
  worker: xpolicylab_ws
  adapter:
    type: manimux.policy_adapter.xr1.tianji:XR1TianjiTacCapAdapter
    group_order: [left_arm, right_arm]
    group_prefixes: {left_arm: left, right_arm: right}
    gripper_dofs: 1
    camera_map:
      cam_left_wrist: left_wrist_camera
      cam_right_wrist: right_wrist_camera
    ik_validation_dt_s: 0.004
  action_decoding: inline
  action_dt_s: 0.03333333333333333
  horizon_steps: 30
  timeout_s: 120.0
  startup_timeout_s: 180.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_name: Xiaomi_Robotics_1
      task_name: pass_ball
      checkpoint_variant: posttrain_pass_ball_50k_8gpu_epoch0_step50000
      checkpoint_source: local_deepspeed_zero2_model_state
      norm_stats_source: pass_ball_training_normalize_sha256_23665c2a1e87
      train_config_name: posttrain_pass_ball_50k_8gpu
      observation_profile: tianji_taccap_two_wrist_black_ego
      action_horizon: 30
      num_steps: 5
      action_type: ee
      output_format: packed_ee_delta
      ego_view_mode: black
      action_semantics: anchor_relative_ee_delta
  options:
    connect_timeout_s: 60.0
    request_timeout_s: 120.0
policy_server:
  config: ../../policy/xiaomi-xr1/tianji/pass_ball/step50000.yaml
camera_server:
  cameras:
    left_wrist: {component: left_wrist_camera, type: taccap}
    right_wrist: {component: right_wrist_camera, type: taccap}
inference:
  algorithm: manimux
  config: ../../inference/tianji_taccap_manimux.yaml
  expected_decode_s: 0.0
executor:
  type: smooth
  config: ../../executor/tianji_taccap_smooth.yaml
  smooth:
    gripper:
      mode: continuous
viewer:
  enabled: false
  robot: tianji-taccap
  policy_label: Xiaomi Robotics 1 / Tianji-TacCap / pass ball
recording:
  enabled: true
