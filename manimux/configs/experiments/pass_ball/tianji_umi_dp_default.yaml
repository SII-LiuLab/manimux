# Bind checkpoint identity with manimux.servers.umi_dp; device bindings use the station file.
control_profile: ../../embodiment/robot/tianji_control.yaml
run:
  task: pass the ball between the two grippers
  output_dir: ./data/experiments/umi-dp-tianji
  max_steps: 2400 # 24 s at control_hz
robot:
  config: ../../embodiment/robot/tianji_taccap.yaml
  options:
    hardware:
      stale_timeout_s: 0.1
  control_hz: 100.0
sensors:
- name: tianji_wrist_history
  driver: manimux.embodiments.sensor.camera_server.timestamped:build_sensor
  service: camera
  options:
    camera_names: [left_wrist, right_wrist]
    max_frame_age_sec: 0.15
    clock_jump_tolerance_s: 0.02
policy:
  action_dt_s: 0.03333333333333333  # Model action spacing, independent of command frequency.
  worker: xpolicylab_ws
  adapter:
    type: manimux.policy_adapter.umi_dp.tianji:UmiDpTianjiAdapter
    deployment_bound: false
    group_order: [left_arm, right_arm]
    group_prefixes: {left_arm: left, right_arm: right}
    gripper_dofs: 1
    camera_map:
      cam_left_wrist: left_wrist
      cam_right_wrist: right_wrist
      cam_left_wrist_prev: left_wrist_prev
      cam_right_wrist_prev: right_wrist_prev
    observation_period_s: 0.1
    observation_tolerance_s: 0.04
    first_action_offset_s: 0.03333333333333333
    state_tolerance_s: 0.02
    camera_skew_s: 0.04
    ik_validation_dt_s: 0.004
    ik_backend: analytic
  horizon_steps: 16 # launcher replaces with the checkpoint's H16/H64/etc.
  timeout_s: 30.0
  startup_timeout_s: 120.0
  expected_backend:
    server: xpolicylab_policy_server
    model:
      policy_family: umi_dp
      observation_profile: tianji_umi_relative2
      action_semantics: absolute_per_arm_base_xyz_wxyz
  options:
    connect_timeout_s: 30.0
    request_timeout_s: 30.0
policy_server:
  config: ../../policy/umi_dp/tianji/assembly.yaml
  task_name: pass_ball
camera_server:
  cameras:
    left_wrist:
      component: left_wrist_camera
      type: taccap
    right_wrist:
      component: right_wrist_camera
      type: taccap
viewer:
  enabled: false
  robot: tianji
  policy_label: UMI DP Tianji
recording:
  enabled: true
# Inference schedules requests and chunks; the executor handles smoothing and limits.
inference:
  algorithm: manimux
  inference_schedule: single_inflight
  refill_threshold_s: 0.25
  max_plan_age_s: 2.0
  blend_steps: 2
  strategy: manimux.policy_adapter.umi_dp.history:build_strategy
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    gripper:
      mode: close_latch
      close_threshold: 0.6
      open_threshold: 0.75
      closed_value: 0.2
