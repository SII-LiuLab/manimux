# YAM bottle deployment: execute the trained relative-joint outputs.
# The original joint+EE training profile and checkpoint artifacts remain unchanged.
policy_name: LingBot_VLA2
protocol: ws
host: 127.0.0.1
port: 8501
bench_name: yam_real
task_name: put_bottles_into_the_bin
env_cfg_type: yam_dual
robot_action_dim_info:
  arm_dim:
  - 6
  - 6
  ee_dim:
  - 1
  - 1
num_envs: 1
env_cfg: yam_dual
action_type: joint
eval_batch: false
checkpoint_variant: lingbot_vla2_yam_put_bottles_b64_step30000
lingbot_vla2_root: lingbot_vla_v2
qwen3vl_path: ${paths.checkpoints}/pretrained/qwen3_vl_4b_processor
model_root: ${paths.checkpoints}/finetuned/ziyang/lingbot-vla2-put-bottles-b64-step30000/checkpoints/global_step_30000/hf_ckpt
training_config_path: ${paths.checkpoints}/finetuned/ziyang/lingbot-vla2-put-bottles-b64-step30000/lingbotvla_cli.yaml
robot_config_path: ${repo}/third_party/XPolicyLab/policy/LingBot_VLA2/robot_configs/yam_dual_packed_relative.yaml
norm_stats_path: ${paths.checkpoints}/finetuned/ziyang/lingbot-vla2-put-bottles-b64-step30000/norm_stats.json
action_horizon: 50
native_hz: 30.0
checkpoint_source: local_lingbot_vla2_put_bottles_b64_step30000
norm_stats_role: checkpoint_matched_yam_put_bottles_joint_ee_v1
use_bf16: true
use_fp32: false
use_compile: false
default_prompt: Put the bottles into the bin.
backend_identity:
  fields:
  - action_horizon
  - checkpoint_variant
  - model_root
  - native_hz
  - norm_stats_path
  - task_name
  model:
    policy_family: lingbot_vla2
    action_semantics: anchor_relative_arm_absolute_gripper
