# Ordinary Pi05 checkpoint selection; preprocessing and output decoding use Model.
# RGB views: exterior and wrist, padded to 224 square. State: seven joints in radians
# plus normalized gripper opening. The selected profile converts opening to closure
# and rebases delta joint predictions to absolute joint targets before returning them.
# Use this checkpoint's assets/droid/norm_stats.json; it supports default sampling only.
policy_name: Pi_05
protocol: ws
host: 127.0.0.1
port: 18190
task_name: pick_yellow_block_pink_bowl
robot_action_dim_info: {arm_dim: [7], ee_dim: [1]}
num_envs: 1
action_type: joint
eval_batch: false
checkpoint_variant: pi05_droid_jointpos
train_config_name: pi05_droid_jointpos
observation_profile: droid_jointpos
repo_id: droid
model_path: openpi/openpi-assets-simeval/pi05_droid_jointpos
norm_stats_path: openpi/openpi-assets-simeval/pi05_droid_jointpos/assets/droid
checkpoint_source: openpi-assets-simeval/pi05_droid_jointpos
norm_stats_source: checkpoint_matched_droid
action_horizon: 15
num_steps: 10
inference_seed: 0
backend_identity:
  fields: [task_name, checkpoint_variant, checkpoint_source, norm_stats_path, norm_stats_source, train_config_name, observation_profile, action_horizon, num_steps, inference_seed]
  aliases: {model_root: model_path}
  model: {policy_family: pi05}
