# Pi05 fine-tuned on ABC-130k bottles real+sim (bottles_trainfmt_putD405_intra, ~79% real) from pi05_base, openpi
# PyTorch path, batch 256, step 20000 of a 30k run. Same contract as pi05_yam: top -> base_0_rgb, left/right wrists,
# 14-D joints with arm deltas and absolute grippers, quantile norm from the checkpoint's assets/yam_bottles.
# PyTorch weights need the openpi-patched transformers 4.53.2: launch with
#   PYTHONPATH=/home/ubuntu/sa/checkpoints/pi05/pi05base_bottles_realsim_bs256_30k_s42_h200/overlay
# Real-robot prompt: "put the plastic bottles in the bin" (sim episodes used "sim_put the plastic bottles in the bin").
policy_name: Pi_05
protocol: ws
host: 127.0.0.1
port: 8500

task_name: put_bottles_into_the_bin
env_cfg_type: yam_dual
robot_action_dim_info: {arm_dim: [6, 6], ee_dim: [1, 1]}
num_envs: 1
action_type: joint
eval_batch: false
checkpoint_variant: pi05_yam_abc_bottles_realsim_step_20000

train_config_name: pi05_yam
observation_profile: yam_native
repo_id: yam_bottles
model_path: /home/ubuntu/sa/checkpoints/pi05/pi05base_bottles_realsim_bs256_30k_s42_h200/20000
checkpoint_source: sha256:a321562892cc49d3f2e99c78fb46f84dfcdf07f44b3f847e586d27264fb3cece
norm_stats_path: /home/ubuntu/sa/checkpoints/pi05/pi05base_bottles_realsim_bs256_30k_s42_h200/20000/assets/yam_bottles
norm_stats_source: checkpoint_matched_yam_bottles
use_delta_joint_actions: true

action_horizon: 50
num_steps: 10
inference_seed: 0

backend_identity:
  fields: [task_name, checkpoint_variant, checkpoint_source, norm_stats_path, norm_stats_source, train_config_name, action_horizon, num_steps, inference_seed]
  aliases: {model_root: model_path}
  model: {policy_family: pi05}
