# Pi05 3-task fine-tune (openpi pi05_yam_3task) from pi05_base, PyTorch path, batch 256, final step 60000.
# Same contract as abc-bottles-realsim-step20000 (config = pi05_yam_bottles except 60k steps / LR decay / norm stats):
# top -> base_0_rgb, left/right wrists, 14-D joints, arm deltas + absolute grippers, quantile norm from assets/yam_3task.
# Training mix: ABC bottles real+sim 1/2, caps1010 pen 1/4, caps1010 unscrew 1/4. The prompt comes from run.task_prompt:
#   "put the plastic bottles in the bin" | "unscrew the bottle caps" | "insert the pens into the pen caps".
# Launch with the openpi transformers overlay:
#   PYTHONPATH=/home/ubuntu/sa/checkpoints/pi05/pi05base_bottles_realsim_bs256_30k_s42_h200/overlay
policy_name: Pi_05
protocol: ws
host: 127.0.0.1
port: 8500

task_name: yam_3task_bottles_pen_unscrew
env_cfg_type: yam_dual
robot_action_dim_info: {arm_dim: [6, 6], ee_dim: [1, 1]}
num_envs: 1
action_type: joint
eval_batch: false
checkpoint_variant: pi05_yam_3task_step_60000

train_config_name: pi05_yam
observation_profile: yam_native
repo_id: yam_3task
model_path: /home/ubuntu/sa/checkpoints/pi05/pi05base_3task_bs256_60k_s42_h200/60000
checkpoint_source: sha256:5107272cd00424cb763b9811a141b137bc55eea193b09a50b254ac327bc4bc83
norm_stats_path: /home/ubuntu/sa/checkpoints/pi05/pi05base_3task_bs256_60k_s42_h200/60000/assets/yam_3task
norm_stats_source: checkpoint_matched_yam_3task
use_delta_joint_actions: true

action_horizon: 50
num_steps: 10
inference_seed: 0

backend_identity:
  fields: [task_name, checkpoint_variant, checkpoint_source, norm_stats_path, norm_stats_source, train_config_name, action_horizon, num_steps, inference_seed]
  aliases: {model_root: model_path}
  model: {policy_family: pi05}
