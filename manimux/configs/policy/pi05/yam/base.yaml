# XPolicyLab Pi_05 server: official pi05_base weights, YAM normalization, and
# an absolute-joint data transform. Launch with manimux/servers/pi05.py.
policy_name: Pi_05
protocol: ws
host: 127.0.0.1
port: 8500

task_name: pick_place
env_cfg_type: yam_dual
action_type: joint
eval_batch: false
checkpoint_variant: pi05_base_with_yam_stats

train_config_name: pi05_base_aloha_full_sim_arx-x5_seed_0
repo_id: yam-bimanual-merged
model_path: pretrained/pi05/pi05_base
checkpoint_source: gs://openpi-assets/checkpoints/pi05_base
norm_stats_path: finetuned/robocurve/pi05-yam-molmoact2/assets/yam-bimanual-merged
norm_stats_source: robocurve/pi05-yam-molmoact2
use_delta_joint_actions: false
adapt_to_pi: false

# Five Euler steps leave more overlap budget for guided RTC than the default 10.
num_steps: 5
