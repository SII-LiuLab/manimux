# In a private copy, match the checkpoint step, training repo ID,
# norm_stats.json SHA-256, and max_delay_steps from provenance/recipe.json.
policy_name: Pi_05_VLASH
protocol: ws
host: 127.0.0.1
port: 8500
env_cfg_type: yam_dual
robot_action_dim_info: {arm_dim: [6, 6], ee_dim: [1, 1]}
num_envs: 1
action_type: joint
eval_batch: false
checkpoint_variant: pi05_vlash_yam_example
train_config_name: pi05_yam_vlash
observation_profile: yam_native
repo_id: REPLACE_WITH_TRAINING_REPO_ID
model_path: ${paths.checkpoints}/pi05-vlash-yam/step
norm_stats_path: ${paths.checkpoints}/pi05-vlash-yam/step/assets/REPLACE_WITH_TRAINING_REPO_ID
norm_stats_source: sha256_REPLACE_WITH_NORM_STATS_SHA256
use_delta_joint_actions: true
action_horizon: 50
num_steps: 10
inference_seed: 0
vlash:
  max_delay_steps: 8
  state_source: previous_action
backend_identity:
  fields: [checkpoint_variant, train_config_name, observation_profile, norm_stats_path,
           norm_stats_source, action_horizon, num_steps, inference_seed, vlash]
  aliases: {model_root: model_path}
  model:
    policy_family: pi05
