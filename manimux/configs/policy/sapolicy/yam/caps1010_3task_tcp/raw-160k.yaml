# SAPolicy caps1010 3-task (bottles real/sim + pen caps + unscrew caps), unfrozen DINOv2-L, CLIP task
# conditioning (v2 table), rot20, TCP 0.01; RAW (non-EMA) weights of last.ckpt, global step 160000.
# Bundle under checkpoints/finetuned/sapolicy/caps1010_3task_tcp/ (not in git): model.ckpt (full Lightning
# ckpt), resolved_config.yaml, action_normalizer.pt, task_clip_table_v2.pt, backbone.pth (DINOv2-L init only;
# the unfrozen backbone weights come from model.ckpt), source/ (SpatialAlignVLA_dinov3abc1003 snapshot).
# The checkpoint's stored default task vector is the SIM bottles task; task_cond_name selects the real one.
# Inference-time RTC is ported into source/ from the tcp_rot20 snapshot (action_head/rtc.py, DiT rtc_condition +
# guided sampling; dit.py.orig is the untouched file). Validated 2026-10-16 (validate_checkpoint --rtc): zero-mask RTC
# identical to ordinary sampling, conditioned-region error 2.6-10x lower, RTC forward ~195-245 ms vs ~55 ms ordinary.
