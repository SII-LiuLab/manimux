# InternW0-Delta (Wan2.2-TI2V-5B video DiT + action DiT + RynnBrain 1.1-2B), trained on the
# latest 300-episode YAM set. Absolute 14-D joint actions at 30 Hz, horizon 32.
# The anchor and 32-step-old frames arrive with every request (memory_source: request), so the
# server keeps no per-step state and any scheduler can use it.
policy_name: InternW0_delta
protocol: ws
host: 127.0.0.1
port: 8500
task_name: yam_latest_300ep
env_cfg_type: yam_dual
robot_action_dim_info:
  arm_dim:
  - 6
  - 6
  ee_dim:
  - 1
  - 1
num_envs: 1
action_type: joint
eval_batch: false
memory_source: request
# Normalization must be the checkpoint's own: the stats shipped with the policy are the RoboDojo
# release's and differ. train_config_path stays the shipped model config; the checkpoint's own
# config.yaml carries a training_time_rtc key the vendored runtime rejects (same architecture).
checkpoint_path: ${paths.checkpoints}/finetuned/InternW0/internw0_latest300_b64_step30000_20261109/robodojo.pt
dataset_stats_path: ${paths.checkpoints}/finetuned/InternW0/internw0_latest300_b64_step30000_20261109/dataset_stats.json
base_model_dir: ${paths.checkpoints}/internw0-assets/Wan-AI/Wan2.2-TI2V-5B
vlm_model_path: ${paths.checkpoints}/internw0-assets/Alibaba-DAMO-Academy/RynnBrain1.1-2B
device: cuda
mixed_precision: bf16
action_horizon: 32
# Official real-robot deployment uses 32: it sets the recent frame's position id from step // 32.
replan_steps: 32
num_inference_steps: 10
action_hz: 30.0
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
timing_enabled: true
allow_dummy_policy: false
default_instruction: follow the instruction
seed: 0
