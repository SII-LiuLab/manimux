# Inference scheduling parameters; experiments explicitly select algorithm. policy.action_dt_s defines the action interval.
chunk_policy_steps: 12
rtc:
  initial_delay_policy_steps: 4
  delay_buffer_size: 10
  beta: 9.1
max_plan_age_s: 2.0
blend_policy_steps: 4
action_start_mode: drop_infer_latency
