# Tianji-TacCap inline-decode scheduling. The experiment selects the algorithm.
inference_schedule: single_inflight
refill_threshold_s: 0.25
max_plan_age_s: 2.0
blend_policy_steps: 2
action_start_mode: drop_infer_latency
# Chunk handoff. waypoint joins new chunks in EE space before dense IK; it requires
# blend_policy_steps: 0 and an adapter with policy.adapter.handoff_waypoint.
handoff: blend
# 0.01 s margin plus the 0.02 s commit lead that main removed, so a waypoint
# handoff keeps its previous distance from the expected decode finish.
handoff_margin_s: 0.03
