# Legacy protocol fixture only. Use rpent_yam.yaml for deployment.
run:
  task_prompt: RPent YAM native tools
  output_dir: ./data/rpent
  max_control_steps: 1000000
  sensor_reading: {mode: background, poll_hz: 30.0, max_frame_age_s: 0.5}
robot:
  type: yam
  config: ../embodiment/robot/yam_dual.yaml
  control_hz: 30.0
  options:
    execute: false  # Explicitly enable only after validating the station and scene.
    move_to_start_on_connect: false
    home_on_close: false
sensors:
- name: rp_yam_rgbd
  driver: manimux.integrations.rpent.sensor:build_sensor
  service: camera
  options:
    # Station services.camera.endpoint is the existing PUB endpoint; use its
    # request_endpoint for this REQ reader (resolved by the integration launcher).
    camera_names: [d405_front, d405_left, d405_right]
    max_frame_age_sec: 0.5
policy:
  worker: external
  action_dt_s: 0.03333333333333333
  horizon_policy_steps: 30
  adapter:
    type: manimux.policy_adapter.joint:JointAdapter
inference:
  algorithm: serial
  inference_schedule: serial
  action_start_mode: first_step_when_ready
  blend_policy_steps: 0
executor:
  type: direct
robogui:
  enabled: false
  robot: yam
recording:
  enabled: true
camera_server:
  config: ../embodiment/sensor/cameras/realsense_3_views.yaml
  cameras:
    d405_front:
      config: ../embodiment/sensor/realsense.yaml
      component: front_camera
      options: {enable_depth: true, align_depth: true, flip: false}
    d405_left:
      config: ../embodiment/sensor/realsense.yaml
      component: left_camera
      options: {enable_depth: true, align_depth: true, flip: false}
    d405_right:
      config: ../embodiment/sensor/realsense.yaml
      component: right_camera
      options: {enable_depth: true, align_depth: true, flip: false}
