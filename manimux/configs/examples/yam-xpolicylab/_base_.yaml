# Shared YAM settings for the XPolicyLab examples. Pass yam_example.yaml as --local for offline checks.
run:
  task_prompt: Put the bottles into the bin.
  max_control_steps: 6000
  warmup_before_start: true
  sensor_reading:
    mode: background
    poll_hz: 100.0
    max_frame_age_s: 0.5
robot:
  type: yam
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    execute: false
    move_to_start_on_connect: false
sensors:
  - name: yam_cameras
    driver: camera_server
    service: camera
    options:
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [d405_left, d405_front, d405_right]
camera_server:
  config: ../../embodiment/sensor/cameras/realsense_3_views.yaml
policy:
  worker: xpolicylab_ws
  service: policy
  action_dt_s: 0.03333333333333333
  timeout_s: 10.0
  adapter:
    type: manimux.policy_adapter.joint:JointAdapter
  options:
    action_format: joint
    request_timeout_s: 10.0
inference:
  algorithm: serial
  inference_schedule: serial
  request_trigger: algorithm
  action_start_mode: first_step_when_ready
  max_plan_age_s: 5.0
  blend_policy_steps: 0
executor:
  type: direct
  motion_limits: null
robogui:
  enabled: true
  robot: yam
recording:
  enabled: true
  video_fps: 30.0
