# Hosted API example. Hardware/task performance has not been validated.
run:
  task_prompt: Put the bottles into the basket.
  max_control_steps: 6000
  warmup_before_start: true
  sensor_reading: {mode: background, poll_hz: 100.0, max_frame_age_s: 0.5}
robot:
  type: yam
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 100.0
  options:
    execute: true
    move_to_start_on_connect: true
    home_duration_s: 2.0
    home_on_close: true
initial_pose:
  config: ../../embodiment/initial_poses/yam.yaml
  id: raised_ready
sensors:
  - name: yam_cameras
    driver: camera_server
    service: camera
    options:
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [d405_left, d405_front, d405_right]
camera_server:
  config: ../../embodiment/sensor/cameras/realsense_3_views.yaml
policy:
  config: ../../policy/dream1/yam/api.yaml
inference:
  algorithm: async
  inference_schedule: single_inflight
  request_trigger: progress
  chunk_policy_steps: 12
  action_start_mode: drop_infer_latency
  max_plan_age_s: 1.6
  blend_policy_steps: 0
executor:
  config: ../../executor/yam_smooth_standard.yaml
  type: smooth
robogui:
  enabled: true
  robot: yam
  policy_label: Dream-1 API - single frame - Async + Smooth
recording:
  enabled: true
  video_fps: 30.0
