# Operator-selected latency budget: 1.3 s. 48 points span 47 intervals.
# Request at K = 47 - ceil(12 * 1.3) = 31.
# Source-progress threshold includes latency-trimmed rows; not 31 executed rows.
_base_: async-slow10-bottles.yaml
run:
  max_control_steps: 0
policy:
  action_dt_s: 0.08333333333333333
inference:
  blend_policy_steps: 2
  handoff_skip_steps: 0
  action_start_mode: drop_infer_latency
  chunk_policy_steps: 31
executor:
  type: direct
  smooth:
    max_velocity: 1.0
    max_acceleration: null
    gripper:
      max_velocity: 1.0
      max_acceleration: null
  motion_limits:
    arm:
      max_velocity: 1.0
      max_acceleration: null
      mode: per_joint
    gripper:
      group_indices: {left_arm: 6, right_arm: 6}
      max_velocity: 1.0
      max_acceleration: null
      max_closing_velocity: null
robogui:
  policy_label: Dream-1 API - Async + Direct limited 100 Hz - 12 Hz - source progress31 - drop latency - blend2 - arm limit 1.0 rad/s
