# Operator-selected latency budget: 1.3 s. 48 points span 47 intervals.
# Request at K = 47 - ceil(18 * 1.3) = 23.
# Source-progress threshold includes latency-trimmed rows; not 23 executed rows.
_base_: async-slow10-bottles.yaml
run:
  max_control_steps: 0
policy:
  action_dt_s: 0.05555555555555555
inference:
  blend_policy_steps: 2
  action_start_mode: drop_infer_latency
  chunk_policy_steps: 23
executor:
  type: direct
  smooth:
    max_velocity: 1.0
    max_acceleration: null
    gripper:
      max_velocity: 1.0
      max_acceleration: null
  motion_limits:
    arm:
      max_velocity: 1.0
      max_acceleration: null
      mode: per_joint
    gripper:
      group_indices: {left_arm: 6, right_arm: 6}
      max_velocity: 1.0
      max_acceleration: null
      max_closing_velocity: null
robogui:
  policy_label: Dream-1 API - Async + Direct limited 100 Hz - 18 Hz - source progress23 - drop latency - blend2
