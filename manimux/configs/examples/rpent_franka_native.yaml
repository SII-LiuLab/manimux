# Legacy protocol fixture only. Use rpent_franka.yaml for deployment.
run:
  task_prompt: RPent Franka primitives
  output_dir: ./data/rpent-franka
  max_control_steps: 1000000
  sensor_reading: {mode: background, poll_hz: 30.0, max_frame_age_s: 0.5}
robot:
  type: franka
  config: ../embodiment/robot/franka_fr3_robotiq.yaml
  control_hz: 30.0
  options:
    execute: false
    move_to_start_on_connect: false
    home_on_close: false
sensors:
- name: rp_franka_rgbd
  driver: manimux.integrations.rpent.sensor:build_sensor
  service: camera
  options:
    camera_names: [wrist]
    max_frame_age_sec: 0.5
policy:
  worker: external
  action_dt_s: 0.03333333333333333
  horizon_policy_steps: 30
  adapter:
    type: manimux.policy_adapter.joint:JointAdapter
inference:
  algorithm: serial
  inference_schedule: serial
  action_start_mode: first_step_when_ready
  blend_policy_steps: 0
executor:
  type: direct
robogui:
  enabled: false
recording:
  enabled: true
