# Offline/deployment template. Current tool TCP is the flange, NOT the grasp point.
# Model outputs must include a normalized gripper coordinate per arm.
run:
  task: Flexiv inference template
  output_dir: ./data/flexiv
  max_control_steps: 1500
robot:
  type: manimux.embodiments.robot.flexiv:build_robot
  config: ../embodiment/robot/flexiv_omnigripper_dual.yaml
  control_hz: 50.0
  options:
    execute: false
sensors: []
policy:
  worker: xpolicylab_ws
  service: policy
  action_dt_s: 0.05
  horizon_policy_steps: 16
  adapter:
    type: manimux.policy_adapter.pose:PoseAdapter
    camera_map: {}
    action_semantics: absolute_per_arm_base_xyz_wxyz
  options:
    action_format: pose
  expected_backend:
    model:
      action_semantics: absolute_per_arm_base_xyz_wxyz
  action_decoding: process
inference:
  algorithm: async
  chunk_policy_steps: 16
  blend_policy_steps: 0
  action_start_mode: first_step_when_ready
  max_plan_age_s: 5.0
executor:
  type: smooth
  smooth:
    cutoff_hz: 5.0
    position_limit_abs: null
  motion_limits:
    arm:
      max_velocity: 0.15
      max_acceleration: 0.3
    gripper: {}
robogui:
  enabled: true
  robot: flexiv-omnigripper-dual
  policy_label: Flexiv OmniGripper flange-reference pose
recording:
  enabled: true
