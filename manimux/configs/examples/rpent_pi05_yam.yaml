# RPent on YAM with Pi05 served locally by XPolicyLab.
#   manimux up --config manimux/configs/examples/rpent_pi05_yam.yaml \
#     --runtime-python envs/yam/.venv/bin/python \
#     --policy-python third_party/XPolicyLab/policy/Pi_05/openpi/.venv/bin/python
# Same station, model and timing as pi05-xpolicylab-yam/serial30-example.yaml; the
# Codex planner chooses observation, motion primitives and Pi05 calls, and RoboGUI shows
# its transcript in the bottom bar. For your station, create local/<name>.yaml with
# `_base_: ../examples/rpent_pi05_yam.yaml` and `robot: {options: {execute: true}}`
# after the offline and Finish checks.
_base_: pi05-xpolicylab-yam/serial30-example.yaml
agent:
  config: ../agents/rpent_pi05_yam.yaml
robot:
  options:
    execute: false
robogui:
  policy_label: Pi05 put-bottles - RPent - Serial 30 Hz
inference:
  # RPent sets rows per call (execute_policy.use_length); a configured chunk cap is rejected.
  chunk_policy_steps: null
  max_chunk_policy_steps: null
