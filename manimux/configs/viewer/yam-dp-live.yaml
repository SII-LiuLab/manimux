# Live physical cameras; DP temporal inputs are assembled separately.
label: YAM
model: ../embodiment/robot/yam_dual.yaml
camera_mode: manual
cameras:
- source: front_camera
  label: Top (live)
  slot: top
- source: left_camera
  label: Left wrist (live)
  slot: left
- source: right_camera
  label: Right wrist (live)
  slot: right
camera_aliases:
  front_camera: top
  front_camera_rgb: top
  top_camera: top
  top_camera_rgb: top
  left_camera: left
  left_camera_rgb: left
  right_camera: right
  right_camera_rgb: right
