control_profile: ../../embodiment/robot/yam_control.yaml
run:
  task: YAM leader teleoperation
  output_dir: data/collection
robot:
  config: ../../embodiment/robot/yam_dual.yaml
  control_hz: 30.0
  options:
    move_to_start_on_connect: false
    home_on_close: false
    execute: true
    component_hardware:
      left_yam:
        channel: can_left
      right_yam:
        channel: can_right
  type: yam
policy:
  action_dt_s: 0.03333333333333333  # 相邻模型动作点的间隔（秒）；不决定下发频率。
  worker: local_yam_leader
  adapter:
    type: manimux.policies.fake:FakePolicyAdapter
  timeout_s: 0.5
  horizon_policy_steps: 2
  options: {}
viewer:
  enabled: false
# 推理算法决定请求与 chunk 交接；执行器独立负责命令平滑和限幅。
inference: {}
executor:
  type: direct
