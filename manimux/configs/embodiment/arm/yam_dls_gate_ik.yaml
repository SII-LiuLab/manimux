# YAM DLS chunk IK, gated method (policy.adapter.ik_backend: dls). As
# yam_dls_ik.yaml, but the joint-motion cost acts only near singularities: full
# below singularity_gate[0], zero above [1] (exact tracking like mink), linear in
# between, on the seed's smallest 6D Jacobian singular value.
# The gate is station data, not a universal constant: [0.03, 0.06] comes from the
# reference station's teleop demonstrations (80 arm trajectories, grasp_site).
# Derive yours with scripts/setup/dls_gate_calibrate.py and override singularity_gate.
max_joint_step_rad: 0.15
max_position_error_m: 0.02
max_rotation_error_rad: 0.17
joint_motion_cost: 0.1
singularity_gate: [0.03, 0.06]
