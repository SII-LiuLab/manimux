# Additional service for the two external RGB views; reuse the wrist/Top service.
# manimux-camera-server --config manimux/configs/embodiment/sensor/cameras/gemini305_gemini335_2_views_standalone.yaml \
#   --rep-endpoint tcp://127.0.0.1:5575 --pub-endpoint tcp://127.0.0.1:5576
sensors:
  cameras:
    gemini305:
      type: orbbec
      device_id: CV278640000Z
      width: 640
      height: 480
      fps: 30
      enable_depth: false
    gemini335:
      type: orbbec
      device_id: CP0N763000LK
      width: 640
      height: 480
      fps: 30
      enable_depth: false
