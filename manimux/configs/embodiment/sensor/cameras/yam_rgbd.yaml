# SAPolicy 3cam bottles: capture 640x480. The model central-crops / resizes
# to its training resolution (210x154) internally.
#
#   envs/yam/.venv/bin/manimux-camera-server --config manimux/configs/embodiment/sensor/cameras/yam_rgbd.yaml

sensors:
  cameras:
    left_camera:
      device_id: "260322276964"
      width: 640
      height: 480
      fps: 30
      max_frame_age_sec: 0.5
    front_camera:
      device_id: "260322276687"
      width: 640
      height: 480
      fps: 30
      max_frame_age_sec: 0.5
    right_camera:
      device_id: "260322274672"
      width: 640
      height: 480
      fps: 30
      max_frame_age_sec: 0.5
