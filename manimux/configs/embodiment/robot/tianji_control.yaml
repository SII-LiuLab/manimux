# Tianji-TacCap component assembly. FK/IK and controller settings are owned by
# manimux/configs/embodiment/; this shared profile retains the original runtime envelopes.
# Device bindings belong in --local; both command switches remain disabled here.
robot:
  type: tianji_taccap
  group_dims:
    left_arm: 8
    right_arm: 8
  options:
    execute: false
    end_effector_control: false

# One authored rate contract. The loader combines it with the assembly's rated
# joint velocity and controller percentages to build motion_limits and guard rates.
rate_contract:
  command_margin: 0.9
  mode: isotropic
  max_step_dt_s: 0.016
  max_acceleration: null
  gripper:
    max_velocity: 3.0
    max_acceleration: 12.0
    max_closing_velocity: 1.0

# Runtime position guard, radians (index 7 is the aperture). The arm limits are
# ccs_m6_40 PNVA bounds minus 5 degrees; arm B J6 is narrowed to +-58 degrees.
command_safety:
  position_lower:
    left_arm: [-2.8797932657906435, -2.007128639793479, -2.8797932657906435, -2.443460952792061, -2.8797932657906435, -0.9599310885968813, -1.4835298641951802, 0.0]
    right_arm: [-2.8797932657906435, -2.007128639793479, -2.8797932657906435, -2.443460952792061, -2.8797932657906435, -0.9250245035569946, -1.4835298641951802, 0.0]
  position_upper:
    left_arm: [2.8797932657906435, 2.007128639793479, 2.8797932657906435, 0.9599310885968813, 2.8797932657906435, 0.9599310885968813, 1.4835298641951802, 1.0]
    right_arm: [2.8797932657906435, 2.007128639793479, 2.8797932657906435, 0.9599310885968813, 2.8797932657906435, 0.9250245035569946, 1.4835298641951802, 1.0]
  max_acceleration: null
