# 组件组合与控制参数；设备 IP/序列号由 local 绑定，离线装配不需要填写。
# Geometry comes from the existing CAD installation, not a fresh calibration.
name: tianji-taccap
# Shared Home / initial arm target; no motion is triggered by loading this config.
# Source: teleop/data/dp_start_20260910.yaml, active joints_deg (not commented values).
# A = left_arm, B = right_arm; original seven-joint order, degrees.
# The source specifies no gripper target. Viewer aperture is display-only config.
home:
  name: dp_start_20260910
  joints_deg:
    left_arm: [102.5, -35.41, -66.17, -113.35, -48.69, -3.29, 28.56]
    right_arm: [-91.29, -33.98, 58.55, -103.75, 45.36, -7.94, -11.5]
  # Recording metadata from the source; these are not current controller states.
  recorded_state:
    left_arm: {state: disabled, error: 0}
    right_arm:
      state: error
      error: 2
      description: servo_fault
      note: carried over from dp_start_20260907, not resampled on 2026-09-10
hardware:
  stale_timeout_s: 0.2
  ready_timeout_s: 3.0
  max_tracking_error_deg: 10  # Original command-to-measured bound.
components:
  # FK/IK 在各臂自身基座中计算；这里仅保留参与 TCP 的末端安装关系。
  left_arm:
    config: ../arm/tianji_left.yaml
  right_arm:
    config: ../arm/tianji_right.yaml
  left_end_effector:
    config: ../end_effector/taccap.yaml
    hardware: {side: left}
    parent: left_arm.flange
    mount: {xyz: [-0.01575, 0.0, 0.0505], rpy: [3.141592653589793, -1.5707963267948966, 0.0]}
  right_end_effector:
    config: ../end_effector/taccap.yaml
    hardware: {side: right}
    parent: right_arm.flange
    mount: {xyz: [-0.01575, 0.0, 0.0505], rpy: [3.141592653589793, -1.5707963267948966, 0.0]}
  left_wrist_camera:
    config: ../sensor/taccap.yaml
    parent: left_end_effector.base
    mount: null  # optical extrinsics are not supplied; do not infer a 3D camera pose
  right_wrist_camera:
    config: ../sensor/taccap.yaml
    parent: right_end_effector.base
    mount: null
groups:
  left_arm: {arm: left_arm, end_effector: left_end_effector}
  right_arm: {arm: right_arm, end_effector: right_end_effector}
