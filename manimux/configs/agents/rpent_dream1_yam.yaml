# RPent recipe for the YAM Dream-1 example (examples/rpent_dream1_yam.yaml).
# Codex uses the account logged in on this host; Astra decides observe/motion/VLA calls.
agent: rpent
experiment: ../examples/rpent_dream1_yam.yaml
# Private, measured: copy rpent_yam_motion.example.yaml to ../local/rpent_yam_motion.yaml.
motion: ../local/rpent_yam_motion.yaml
endpoint: http://127.0.0.1:8088
task: Put the bottles into the basket.
planner: codex
model: gpt-6-astra
reasoning_effort: high
max_turns: 30
memory_root: ../../../data/agent-memory/rpent-dream1-yam
output_dir: ../../../data/rpent-dream1-yam-agent
