run:
  max_control_steps: 6000
  task_prompt: put_the_coin_into_the_bin2
  experiment_template:
    name: put_the_coin_into_the_bin2 - ten layouts, three repeats
    layout_ids:
    - '01'
    - '02'
    - '03'
    - '04'
    - '05'
    - '06'
    - '07'
    - '08'
    - '09'
    - '10'
    require_reference: true
evaluation:
  kind: stages
  task_id: coin
  rubric_id: coin_stages_v2
  label: Coin deposit
  options:
  - id: incomplete
    label: No coin picked up
    score: 0
    success: false
  - id: picked_up
    label: Coin picked up by one hand
    score: 0.1
    success: false
  - id: handover
    label: Left-right handover complete
    score: 0.3
    success: false
  - id: above_bank
    label: Coin held above piggy bank
    score: 0.5
    success: false
  - id: deposited
    label: Coin deposited in target
    score: 1
    success: true
