# Shared YAM starting pose for every model running this task.
initial_pose:
  config: ../embodiment/initial_poses/yam.yaml
  id: raised_ready
robot:
  options:
    move_to_start_on_connect: true
run:
  max_control_steps: 6000
  task_prompt: pick_the_moving_cube
  experiment_template:
    name: pick_the_moving_cube - ten layouts, three repeats
    layout_ids:
    - '01'
    - '02'
    - '03'
    - '04'
    - '05'
    - '06'
    - '07'
    - 08
    - 09
    - '10'
    require_reference: true
evaluation:
  kind: stages
  task_id: pick_the_moving_cube
  rubric_id: pick_the_moving_cube_stages_v2
  label: pick_the_moving_cube
  options:
  - id: failure
    label: Not completed
    score: 0.0
    success: false
  - id: picked_up
    label: Cube picked up
    score: 0.1
    success: false
  - id: success
    label: Completed
    score: 1.0
    success: true
