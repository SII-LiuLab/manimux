model: ../../../configs/embodiment/robot/tianji_taccap.yaml
camera_mode: policy
# No agent/top camera on this station. Add slot: top when one is available.
cameras:
  - {source: left_wrist, label: wrist, slot: left}
  - {source: right_wrist, label: wrist, slot: right}
camera_aliases:
  left_wrist: left
  left_wrist_camera: left
  right_wrist: right
  right_wrist_camera: right
groups:
