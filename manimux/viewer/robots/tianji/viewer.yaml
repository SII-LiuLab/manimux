    prediction_color: [52, 111, 255]
    trail_color: [33, 180, 106]
    # Radians plus normalized gripper opening, in RobotModel coordinate order.
    initial: [1.5707963267948966, -1.5707963267948966, -1.5707963267948966, -1.5707963267948966, 0, 0, 0, 1]
    aperture: gripper
    demo:
      amplitude: [0, 0.1745329252, 0, 0.1396263402, 0, 0.0872664626, 0, 0]
      phase: 0.0
  right_arm:
    label: Right arm (B)
    viewer_display_frame: {xyz: [0.0, -0.037, 1.121], rpy: [1.5707963267948966, 0.0, 0.0]}
    prediction_color: [255, 94, 87]
    trail_color: [255, 170, 0]
    initial: [-1.5707963267948966, -1.5707963267948966, 1.5707963267948966, -1.5707963267948966, 0, 0, 0, 1]
    aperture: gripper
    demo:
      amplitude: [0, 0.1745329252, 0, 0.1396263402, 0, 0.0872664626, 0, 0]
      phase: 1.57079632679
