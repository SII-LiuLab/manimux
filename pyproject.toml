[project]
name = "manimux"
version = "0.1.0"
description = "Local asynchronous policy runtime for dual-arm robot evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26,<2.5",
  "pillow>=10",
  "pydantic>=2.8",
  "pyzmq>=26",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "viser>=1.0.30",
  "yourdfpy>=0.0.58",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
collection-analysis = [
  "matplotlib>=3.8",
]
tianji-diff-ik = [
  "osqp>=1,<2",
]
collection = [
  "av>=12",
  "pyudev>=0.24; sys_platform == 'linux'",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "opencv-python>=4.10",
  "httpx>=0.27",
  "h5py>=3.11",
]
cameras = [
  "opencv-python>=4.10",
  "pyrealsense2>=2.55",
]

# No torch, no model code: the policy runs inside XPolicyLab's own environment
# and is reached over its WebSocket protocol. This extra is only the wire.
xpolicylab = [
  "msgpack>=1.0.8",
  "msgpack-numpy>=0.4.8",
  "websockets>=14",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
manimux = "manimux.cli:main"
manimux-collect = "manimux.collection.cli:main"
manimux-viewer = "manimux.viewer.dashboard:main"
manimux-camera-server = "manimux.sensors.camera_server.server:main"

[project.entry-points."manimux.viewer.robots"]
tianji = "manimux.viewer.robots.tianji:TianjiAdapter"
yam = "manimux.viewer.robots.yam:YamAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manimux"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "manimux/THIRD_PARTY_NOTICES.md"
"licenses/MolmoAct2-APACHE-2.0.txt" = "manimux/licenses/MolmoAct2-APACHE-2.0.txt"
"licenses/i2rt-MIT.txt" = "manimux/licenses/i2rt-MIT.txt"
"licenses/Xiaomi-Robotics-1-APACHE-2.0.txt" = "manimux/licenses/xiaomi-robotics-1-APACHE-2.0.txt"
"src/manimux/robots/tianji/vendor/marvin/LICENSE" = "manimux/licenses/marvin-sdk-APACHE-2.0.txt"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/manimux/robots/tianji/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "off"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["manimux"]
exclude = ["src/manimux/robots/tianji/vendor"]

[[tool.mypy.overrides]]
module = [
  "msgpack",
  "msgpack_numpy",
  "mujoco",
  "scipy",
  "scipy.*",
  "viser",
  "viser.*",
  "websockets.*",
  "yourdfpy",
  "zarr",
  "zarr.*",
]
ignore_missing_imports = true
