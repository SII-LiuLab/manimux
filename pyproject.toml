[project]
name = "manimux"
version = "0.1.0"
description = "Local asynchronous policy runtime for dual-arm robot evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26,<2.5",
  "pillow>=10",
  "pydantic>=2.8",
  "pyzmq>=26",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "viser>=1.0.30",
  "yourdfpy>=0.0.58",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
molmoact-yam = [
  "fastapi>=0.116",
  "h5py>=3.11",
  "hf-transfer>=0.1.8",
  "huggingface-hub>=0.36",
  "json-numpy>=2.1.0",
  "omegaconf>=2.3",
  "opencv-python>=4.10",
  "pyrealsense2>=2.55",
  "requests>=2.32",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm>=4.66",
  "transformers>=4.57,<4.58",
  "tyro>=1.0.13",
  "uvicorn[standard]>=0.35",
]

# No torch, no model code: the policy runs inside XPolicyLab's own environment
# and is reached over its WebSocket protocol. This extra is only the wire.
xpolicylab = [
  "msgpack>=1.0.8",
  "msgpack-numpy>=0.4.8",
  "websockets>=14",
]

# torch is deliberately absent: the ABC checkpoint is validated against the
# CUDA-12.8 build, which lives on a different index than the pinned cu121 wheels
# used by molmoact-yam. Install it into envs/abc first, then this group.
abc-yam = [
  "fastapi>=0.116",
  "ftfy>=6.2",
  "json-numpy>=2.1.0",
  "regex>=2024.5.15",
  "requests>=2.32",
  "uvicorn[standard]>=0.35",
]

# torch is deliberately absent: XR-1 is validated against torch 2.8 / CUDA 12.6
# plus a matching flash-attn build. Install those into envs/xr1 first.
xr1-yam = [
  "accelerate>=1.11",
  "fastapi>=0.116",
  "json-numpy>=2.1.0",
  "liger-kernel==0.6.5",
  "mmengine==0.10.7",
  "requests>=2.32",
  "safetensors>=0.6",
  "transformers==4.57.1",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
manimux = "manimux.cli:main"
manimux-viewer = "manimux.viewer.dashboard:main"
manimux-molmoact-yam = "manimux.viewer.integrations.molmoact_yam:main"
manimux-camera-server = "manimux.sensors.camera_server.server:main"
manimux-molmoact-server = "manimux.integrations.molmoact_yam.host_server_yam:main"
manimux-abc-server = "manimux.integrations.abc_yam.host_server_abc:main"

[project.entry-points."manimux.viewer.robots"]
yam = "manimux.viewer.robots.yam:YamAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/manimux"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "manimux/THIRD_PARTY_NOTICES.md"
"licenses/MolmoAct2-APACHE-2.0.txt" = "manimux/licenses/MolmoAct2-APACHE-2.0.txt"
"licenses/i2rt-MIT.txt" = "manimux/licenses/i2rt-MIT.txt"
"src/manimux/integrations/abc_yam/abc_minimal/third_party/clip/LICENSE" = "manimux/licenses/abc-clip-MIT.txt"
"src/manimux/integrations/abc_yam/abc_minimal/third_party/dinov3/LICENSE.md" = "manimux/licenses/abc-dinov3.md"
"src/manimux/integrations/xr1_yam/mibot/LICENSE" = "manimux/licenses/xiaomi-robotics-1-APACHE-2.0.txt"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "off"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["manimux"]
exclude = ["src/manimux/integrations/molmoact_yam"]

[[tool.mypy.overrides]]
module = [
  "msgpack",
  "msgpack_numpy",
  "mujoco",
  "scipy",
  "scipy.*",
  "viser",
  "viser.*",
  "websockets.*",
  "yourdfpy",
  "zarr",
  "zarr.*",
]
ignore_missing_imports = true
