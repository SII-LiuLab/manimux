# Test fixture only; the robot plugin lives under tests/support.
run:
  task: test_runtime_wave
  output_dir: ./data
  max_control_steps: 120

robot:
  type: tests.support.robot:build_robot
  control_hz: 100.0
  group_dims:
    left_arm: 6
    right_arm: 6
    left_gripper: 1
    right_gripper: 1

sensors:
- name: overhead
  driver: tests.support.sensor:build_sensor
  width: 64
  height: 48
  fps: 30.0

policy:
  worker: fake
  adapter:
    type: manimux.policies.fake:FakePolicyAdapter
  device: cpu
  action_dt_s: 0.05
  timeout_s: 0.5
  horizon_policy_steps: 20
  inference_delay_s: 0.04

  options: {}
viewer:
  enabled: false
  robot_adapter: yam

recording:
  enabled: true
inference:
  refill_threshold_s: 0.4
  commit_lead_s: 0.02
  max_plan_age_s: 1.0
  blend_policy_steps: 2
executor:
  type: smooth
  smooth:
    cutoff_hz: 8.0
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14
  mpc:
    horizon_control_steps: 15
    dynamics_a: 0.85
    tracking_weight: 10.0
    command_delta_weight: 1.0
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14
